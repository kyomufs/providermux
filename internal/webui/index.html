<!doctype html>
<html lang="ru" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#FBF8FD" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121318" media="(prefers-color-scheme: dark)">
<title>providermux</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%234A5AC7'/%3E%3Cpath d='M5 8.5 12 4.5l7 4v7L12 19.5l-7-4z' fill='none' stroke='white' stroke-width='1.7' stroke-linejoin='round'/%3E%3Cpath d='M12 12 5 8.5M12 12l7-3.5M12 12v7.5' stroke='white' stroke-width='1.3'/%3E%3C/svg%3E">
<style>
/* ============ design tokens (M3 baseline roles + spring motion) ============ */
:root {
  --primary:#4A5AC7;            --on-primary:#FFFFFF;
  --primary-container:#DEE0FF;  --on-primary-container:#00105C;
  --secondary:#5B5D72;          --on-secondary:#FFFFFF;
  --secondary-container:#DFE0F9;--on-secondary-container:#181A2C;
  --tertiary:#00696D;           --on-tertiary:#FFFFFF;
  --tertiary-container:#B4ECEE; --on-tertiary-container:#002021;
  --error:#B3261E;              --on-error:#FFFFFF;
  --error-container:#F9DEDC;    --on-error-container:#410E0B;
  --surface:#FBF8FD;
  --surface-lowest:#FFFFFF;
  --surface-low:#F5F2FA;
  --surface-container:#EFEDF4;
  --surface-high:#E9E7EF;
  --surface-highest:#E3E1E9;
  --on-surface:#1B1B21;
  --on-surface-variant:#46464F;
  --outline:#767680;
  --outline-variant:#C7C5D0;
  --scrim:rgba(20,20,26,.42);

  --r-xs:4px; --r-sm:8px; --r-md:12px; --r-lg:16px; --r-xl:20px; --r-full:999px;
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px; --s7:48px;

  --spring:cubic-bezier(.34,1.32,.64,1);  /* spatial: slight overshoot */
  --ease:cubic-bezier(.2,0,0,1);          /* effects: critically damped */
  --dur-spatial:420ms; --dur-effects:200ms;

  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    --primary:#BAC3FF;            --on-primary:#1B2779;
    --primary-container:#333E90;  --on-primary-container:#DEE0FF;
    --secondary:#C3C4DD;          --on-secondary:#2C2E42;
    --secondary-container:#424459;--on-secondary-container:#DFE0F9;
    --tertiary:#4FD8DC;           --on-tertiary:#00363A;
    --tertiary-container:#004F53; --on-tertiary-container:#B4ECEE;
    --error:#FFB4AB;              --on-error:#690005;
    --error-container:#93000A;    --on-error-container:#FFDAD6;
    --surface:#121318;
    --surface-lowest:#0D0E12;
    --surface-low:#1A1B21;
    --surface-container:#1E1F25;
    --surface-high:#282A2F;
    --surface-highest:#33343A;
    --on-surface:#E4E1E9;
    --on-surface-variant:#C7C5D0;
    --outline:#90909A;
    --outline-variant:#46464F;
    --scrim:rgba(0,0,0,.6);
  }
}
html[data-theme="light"] { color-scheme: light; }
html[data-theme="dark"]  { color-scheme: dark; }
html[data-theme="light"] body { --primary:#4A5AC7; --on-primary:#fff; --primary-container:#DEE0FF; --on-primary-container:#00105C; --secondary:#5B5D72; --secondary-container:#DFE0F9; --on-secondary-container:#181A2C; --tertiary:#00696D; --tertiary-container:#B4ECEE; --on-tertiary-container:#002021; --error:#B3261E; --error-container:#F9DEDC; --on-error-container:#410E0B; --surface:#FBF8FD; --surface-lowest:#fff; --surface-low:#F5F2FA; --surface-container:#EFEDF4; --surface-high:#E9E7EF; --surface-highest:#E3E1E9; --on-surface:#1B1B21; --on-surface-variant:#46464F; --outline:#767680; --outline-variant:#C7C5D0; }
html[data-theme="dark"] body { --primary:#BAC3FF; --on-primary:#1B2779; --primary-container:#333E90; --on-primary-container:#DEE0FF; --secondary:#C3C4DD; --secondary-container:#424459; --on-secondary-container:#DFE0F9; --tertiary:#4FD8DC; --tertiary-container:#004F53; --on-tertiary-container:#B4ECEE; --error:#FFB4AB; --error-container:#93000A; --on-error-container:#FFDAD6; --surface:#121318; --surface-lowest:#0D0E12; --surface-low:#1A1B21; --surface-container:#1E1F25; --surface-high:#282A2F; --surface-highest:#33343A; --on-surface:#E4E1E9; --on-surface-variant:#C7C5D0; --outline:#90909A; --outline-variant:#46464F; }

/* ============ reset ============ */
*,*::before,*::after { box-sizing:border-box; }
html,body { margin:0; padding:0; }
body {
  background:var(--surface); color:var(--on-surface);
  font-family:var(--font); font-size:16px; line-height:24px;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  min-height:100dvh;
}
h1,h2,h3,h4,p { margin:0; }
button,input,select,textarea { font:inherit; color:inherit; }
button { cursor:pointer; background:none; border:0; }
svg { display:block; }
:focus-visible { outline:3px solid var(--primary); outline-offset:2px; border-radius:var(--r-xs); }
::selection { background:var(--primary-container); color:var(--on-primary-container); }

.skip {
  position:fixed; left:12px; top:-60px; z-index:100;
  background:var(--primary); color:var(--on-primary);
  padding:10px 16px; border-radius:var(--r-full); text-decoration:none;
  transition:top var(--dur-effects) var(--ease);
}
.skip:focus { top:12px; }

/* ============ shell ============ */
.appbar {
  position:sticky; top:0; z-index:30;
  display:flex; align-items:center; gap:var(--s3);
  height:64px; padding:0 var(--s5);
  background:color-mix(in srgb, var(--surface) 88%, transparent);
  backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px);
  border-bottom:1px solid var(--outline-variant);
}
.brand { display:flex; align-items:center; gap:10px; min-width:0; }
.brand-mark {
  width:34px; height:34px; border-radius:11px; flex:none;
  display:grid; place-items:center; color:var(--on-primary-container);
  background:linear-gradient(135deg, var(--primary-container), var(--tertiary-container));
}
.brand-name { font-size:16px; font-weight:600; letter-spacing:.01em; }
.brand-sub { font-size:11px; color:var(--on-surface-variant); letter-spacing:.06em; text-transform:uppercase; }
.appbar-spacer { flex:1; }

.shell { display:flex; min-height:calc(100dvh - 64px); }
.rail {
  width:96px; flex:none; padding:var(--s4) 8px var(--s5);
  display:flex; flex-direction:column; gap:6px; align-items:center;
  border-right:1px solid var(--outline-variant); background:var(--surface-low);
  position:sticky; top:64px; height:calc(100dvh - 64px); overflow-y:auto;
}
.rail-item, .bottom-item {
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:4px; width:100%; padding:10px 4px; border-radius:var(--r-lg);
  color:var(--on-surface-variant); font-size:11px; line-height:14px; text-align:center;
  transition:background var(--dur-effects) var(--ease), color var(--dur-effects) var(--ease);
}
.rail-item:hover, .bottom-item:hover { background:var(--surface-container); color:var(--on-surface); }
.rail-item[aria-current="page"], .bottom-item[aria-current="page"] {
  background:var(--secondary-container); color:var(--on-secondary-container);
}
.rail-item[aria-current="page"] .nav-icon, .bottom-item[aria-current="page"] .nav-icon { transform:scale(1.06); }
.nav-icon { width:24px; height:24px; transition:transform var(--dur-spatial) var(--spring); }

main {
  flex:1; min-width:0; max-width:1320px; padding:var(--s5) var(--s5) var(--s7);
  margin:0 auto; width:100%;
}
.bottom-nav { display:none; }

/* ============ page furniture ============ */
.page-head { display:flex; align-items:flex-end; gap:var(--s4); flex-wrap:wrap; margin-bottom:var(--s5); }
.page-head h1 { font-size:28px; line-height:36px; font-weight:600; letter-spacing:-.01em; }
.page-head .lead { color:var(--on-surface-variant); font-size:14px; line-height:20px; max-width:60ch; margin-top:2px; }
.page-head .spacer { flex:1; }

.grid { display:grid; gap:var(--s4); grid-template-columns:repeat(auto-fit,minmax(min(260px,100%),1fr)); }
.grid.two { grid-template-columns:repeat(auto-fit,minmax(min(430px,100%),1fr)); }
.stack { display:flex; flex-direction:column; gap:var(--s4); }
.row { display:flex; align-items:center; gap:var(--s3); flex-wrap:wrap; }
.muted { color:var(--on-surface-variant); }
.small { font-size:13px; line-height:18px; }
.mono { font-family:var(--mono); font-size:13px; letter-spacing:-.01em; }
.mt3 { margin-top:var(--s3); } .mt4 { margin-top:var(--s4); }
.sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; border:0; }

.card {
  background:var(--surface-container); border-radius:var(--r-lg);
  padding:var(--s4); border:1px solid transparent;
  transition:background var(--dur-effects) var(--ease);
}
.card.outlined { background:var(--surface-low); border-color:var(--outline-variant); }
.card-head { display:flex; align-items:center; gap:var(--s2); margin-bottom:var(--s3); }
.card-title { font-size:16px; font-weight:600; line-height:24px; }
.card-sub { font-size:12px; line-height:16px; color:var(--on-surface-variant); }

/* ============ pills, chips, badges ============ */
.pill {
  display:inline-flex; align-items:center; gap:6px;
  padding:4px 12px; border-radius:var(--r-full);
  background:var(--surface-high); color:var(--on-surface-variant);
  font-size:12px; line-height:16px; font-weight:500; white-space:nowrap;
}
.pill .dot { width:8px; height:8px; border-radius:var(--r-full); background:currentColor; flex:none; }
.pill.ok { background:var(--tertiary-container); color:var(--on-tertiary-container); }
.pill.err { background:var(--error-container); color:var(--on-error-container); }
.pill.accent { background:var(--primary-container); color:var(--on-primary-container); }
.pill.warn { background:var(--secondary-container); color:var(--on-secondary-container); }
.chip {
  display:inline-flex; align-items:center; gap:6px; max-width:100%;
  padding:6px 12px; border-radius:var(--r-sm);
  background:var(--surface-high); font-size:12px; line-height:16px;
  border:1px solid var(--outline-variant);
}
.chip button { color:var(--on-surface-variant); display:grid; place-items:center; border-radius:var(--r-full); }
.chip button:hover { color:var(--error); }
.badge {
  display:inline-flex; align-items:center; justify-content:center;
  min-width:22px; height:22px; padding:0 7px; border-radius:var(--r-full);
  background:var(--primary-container); color:var(--on-primary-container);
  font-size:11px; font-weight:600; font-variant-numeric:tabular-nums;
}
.kv { display:flex; align-items:baseline; justify-content:space-between; gap:var(--s3); padding:6px 0; border-bottom:1px solid var(--outline-variant); }
.kv:last-child { border-bottom:0; }
.kv dt { color:var(--on-surface-variant); font-size:13px; }
.kv dd { margin:0; font-size:13px; font-weight:500; text-align:right; }

/* ============ KPI ============ */
.kpi { display:flex; flex-direction:column; gap:2px; }
.kpi-label { font-size:12px; letter-spacing:.04em; text-transform:uppercase; color:var(--on-surface-variant); }
.kpi-value { font-size:34px; line-height:40px; font-weight:600; letter-spacing:-.02em; font-variant-numeric:tabular-nums; }
.kpi-value.err { color:var(--error); }
.kpi-note { font-size:12px; color:var(--on-surface-variant); }

/* ============ buttons ============ */
.btn {
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  height:40px; padding:0 20px; border-radius:var(--r-full);
  font-size:14px; font-weight:500; letter-spacing:.01em; white-space:nowrap;
  transition:transform var(--dur-spatial) var(--spring), background var(--dur-effects) var(--ease), box-shadow var(--dur-effects) var(--ease);
}
.btn .nav-icon { width:18px; height:18px; }
.btn:active { transform:scale(.97); }
.btn:disabled { opacity:.5; cursor:not-allowed; }
.btn-filled { background:var(--primary); color:var(--on-primary); }
.btn-filled:hover:not(:disabled) { box-shadow:0 1px 3px rgba(0,0,0,.22); }
.btn-tonal { background:var(--secondary-container); color:var(--on-secondary-container); }
.btn-tonal:hover:not(:disabled) { background:color-mix(in srgb, var(--secondary-container) 82%, var(--on-secondary-container)); }
.btn-outlined { border:1px solid var(--outline); color:var(--primary); }
.btn-outlined:hover:not(:disabled) { background:color-mix(in srgb, var(--primary) 8%, transparent); }
.btn-text { color:var(--primary); padding:0 12px; }
.btn-text:hover:not(:disabled) { background:color-mix(in srgb, var(--primary) 10%, transparent); }
.btn-danger { background:var(--error-container); color:var(--on-error-container); }
.btn-icon { width:40px; height:40px; padding:0; border-radius:var(--r-full); color:var(--on-surface-variant); }
.btn-icon:hover { background:var(--surface-high); color:var(--on-surface); }
.btn-sm { height:32px; padding:0 14px; font-size:13px; }

/* ============ form controls ============ */
.field { display:flex; flex-direction:column; gap:6px; }
.label { font-size:12px; line-height:16px; letter-spacing:.03em; text-transform:uppercase; color:var(--on-surface-variant); font-weight:500; }
.input, .select, .textarea {
  height:44px; padding:0 14px; border-radius:var(--r-sm);
  background:var(--surface-lowest); color:var(--on-surface);
  border:1px solid var(--outline-variant);
  transition:border-color var(--dur-effects) var(--ease), background var(--dur-effects) var(--ease);
  width:100%;
}
.textarea { height:auto; min-height:76px; padding:10px 14px; resize:vertical; }
.input:hover, .select:hover, .textarea:hover { border-color:var(--outline); }
.input:focus, .select:focus, .textarea:focus { border-color:var(--primary); outline:2px solid color-mix(in srgb, var(--primary) 34%, transparent); outline-offset:0; }
.hint { font-size:12px; line-height:16px; color:var(--on-surface-variant); }

.segmented {
  display:inline-flex; padding:4px; gap:2px; border-radius:var(--r-full);
  background:var(--surface-high);
}
.segmented button {
  padding:7px 14px; border-radius:var(--r-full); font-size:13px; font-weight:500;
  color:var(--on-surface-variant); white-space:nowrap;
  transition:background var(--dur-effects) var(--ease), color var(--dur-effects) var(--ease), transform var(--dur-spatial) var(--spring);
}
.segmented button:hover:not(:disabled) { color:var(--on-surface); }
.segmented button[aria-checked="true"] {
  background:var(--surface-lowest); color:var(--primary);
  box-shadow:0 1px 2px rgba(0,0,0,.14);
}
.segmented button:disabled { opacity:.45; cursor:not-allowed; }

.switch {
  position:relative; width:52px; height:32px; flex:none; border-radius:var(--r-full);
  background:var(--surface-highest); border:2px solid var(--outline);
  transition:background var(--dur-effects) var(--ease), border-color var(--dur-effects) var(--ease);
}
.switch::after {
  content:""; position:absolute; top:50%; left:6px; width:16px; height:16px; border-radius:var(--r-full);
  background:var(--outline); transform:translateY(-50%);
  transition:left var(--dur-spatial) var(--spring), width var(--dur-spatial) var(--spring), background var(--dur-effects) var(--ease);
}
.switch[aria-checked="true"] { background:var(--primary); border-color:var(--primary); }
.switch[aria-checked="true"]::after { left:26px; width:20px; height:20px; background:var(--on-primary); }
.switch:disabled { opacity:.45; cursor:not-allowed; }

/* ============ tables ============ */
.table-wrap { overflow-x:auto; border-radius:var(--r-md); }
table { width:100%; border-collapse:collapse; font-size:13px; }
th, td { text-align:left; padding:11px 12px; }
thead th {
  font-size:11px; letter-spacing:.06em; text-transform:uppercase; font-weight:600;
  color:var(--on-surface-variant); border-bottom:1px solid var(--outline-variant);
  position:sticky; top:0; background:var(--surface-container); z-index:1;
}
tbody tr { border-bottom:1px solid var(--outline-variant); }
tbody tr:last-child { border-bottom:0; }
tbody tr:hover { background:color-mix(in srgb, var(--surface-high) 70%, transparent); }
td.num, th.num { text-align:right; font-variant-numeric:tabular-nums; }

/* ============ bars ============ */
.bar-track { height:8px; border-radius:var(--r-full); background:var(--surface-highest); overflow:hidden; }
.bar-fill { height:100%; border-radius:var(--r-full); background:var(--primary); transition:width var(--dur-spatial) var(--spring); }
.bar-fill.ok { background:var(--tertiary); }
.bar-fill.warn { background:var(--secondary); }
.bar-fill.err { background:var(--error); }

.chart { display:flex; align-items:flex-end; gap:10px; height:112px; padding-top:6px; }
.chart-col { flex:1; display:flex; flex-direction:column; justify-content:flex-end; gap:6px; align-items:center; min-width:0; }
.chart-count { font-size:11px; font-variant-numeric:tabular-nums; color:var(--on-surface-variant); white-space:nowrap; }
.chart-bar { width:100%; max-width:38px; border-radius:var(--r-xs) var(--r-xs) 2px 2px; background:var(--primary); opacity:.85; transition:height var(--dur-spatial) var(--spring); }
.chart-bar:hover { opacity:1; }
.chart-day { font-size:11px; color:var(--on-surface-variant); white-space:nowrap; }

/* ============ states ============ */
.empty { display:flex; flex-direction:column; align-items:center; gap:8px; padding:var(--s6) var(--s4); text-align:center; color:var(--on-surface-variant); }
.empty svg { width:32px; height:32px; opacity:.6; }
.notice { display:flex; gap:10px; padding:12px 14px; border-radius:var(--r-md); background:var(--secondary-container); color:var(--on-secondary-container); font-size:13px; line-height:19px; }
.notice.danger { background:var(--error-container); color:var(--on-error-container); }
.notice svg { width:18px; height:18px; flex:none; margin-top:1px; }

.skeleton { background:linear-gradient(90deg, var(--surface-container), var(--surface-high), var(--surface-container)); background-size:200% 100%; animation:shimmer 1.4s linear infinite; border-radius:var(--r-sm); height:16px; }
@keyframes shimmer { from { background-position:200% 0; } to { background-position:-200% 0; } }

/* ============ snackbar + dialog ============ */
.snackbar {
  position:fixed; left:50%; bottom:24px; transform:translate(-50%, 24px);
  max-width:min(560px, calc(100vw - 32px));
  display:flex; align-items:flex-start; gap:10px;
  padding:14px 18px; border-radius:var(--r-md);
  background:var(--surface-highest); color:var(--on-surface);
  box-shadow:0 4px 12px rgba(0,0,0,.24);
  font-size:14px; line-height:20px;
  opacity:0; pointer-events:none; z-index:60;
  transition:opacity var(--dur-effects) var(--ease), transform var(--dur-spatial) var(--spring);
}
.snackbar.show { opacity:1; transform:translate(-50%,0); pointer-events:auto; }
.snackbar.err { background:var(--error-container); color:var(--on-error-container); }
.snackbar svg { width:20px; height:20px; flex:none; margin-top:1px; }

dialog {
  border:0; padding:0; border-radius:var(--r-xl); background:var(--surface-container);
  color:var(--on-surface); max-width:min(520px, calc(100vw - 32px)); width:100%;
  box-shadow:0 12px 32px rgba(0,0,0,.34);
}
dialog::backdrop { background:var(--scrim); backdrop-filter:blur(2px); }
.dialog-body { padding:var(--s5); display:flex; flex-direction:column; gap:var(--s4); }
.dialog-title { font-size:22px; line-height:28px; font-weight:600; }
.dialog-actions { display:flex; justify-content:flex-end; gap:8px; }

/* ============ responsive ============ */
@media (max-width: 900px) {
  .rail { display:none; }
  main { padding:var(--s4) var(--s4) 104px; }
  .appbar { padding:0 var(--s4); }
  .bottom-nav {
    display:flex; position:fixed; bottom:0; left:0; right:0; z-index:40;
    background:color-mix(in srgb, var(--surface-container) 92%, transparent);
    backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px);
    border-top:1px solid var(--outline-variant);
    padding:6px 8px calc(6px + env(safe-area-inset-bottom)); gap:2px;
  }
  .bottom-item { padding:8px 2px; }
  .page-head h1 { font-size:24px; line-height:30px; }
  .hide-sm { display:none; }
  .snackbar { bottom:88px; }
}
@media (max-width: 560px) {
  .grid { grid-template-columns:1fr; }
  .kpi-value { font-size:28px; line-height:34px; }
}
@media (prefers-reduced-motion: reduce) {
  *,*::before,*::after { animation-duration:.001ms !important; transition-duration:.001ms !important; }
}
</style>
</head>

    <div class="field">
      <label class="label" for="token-input">Bearer-токен</label>

<script>
"use strict";

/* ---------- constants ---------- */
const ROUTES = [
  { id:"overview",  label:"Обзор",      icon:"i-overview",  title:"Обзор" },
  { id:"providers", label:"Провайдеры", icon:"i-providers", title:"Провайдеры" },
  { id:"models",    label:"Каталог",    icon:"i-models",    title:"Каталог моделей" },
  { id:"quota",     label:"Квоты",      icon:"i-quota",     title:"Квоты AntiGravity" },
  { id:"settings",  label:"Параметры",  icon:"i-settings",  title:"Параметры" },
];
const POLL_MS = 10000;
const AXIS_HINT = {
  mode:"Режим шлюза: local слушает только loopback, server требует токен",
  credential:"anonymous — ключ не отправляется; account — ключ уходит провайдеру",
  key_rotation:"Ротация ключей работает только под credential=account",
  family:"Семейство адресов, по которому провайдер считает лимит",
  transport:"Транспорт исходящих запросов",
};

/* ---------- state ---------- */
const state = {
  token: "",
  theme: "auto",
  route: "overview",
  status: null,
  stats: null,
  options: null,
  models: null,
  keys: null,
  quota: null,
  loading: {},
  errors: {},
  oauth: null,
  busy: new Set(),
  handledCallback: false,
  lastAt: 0,
};

const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));

function esc(v) {
  return String(v == null ? "" : v).replace(/[&<>"']/g, (c) => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
}
const num = (v) => new Intl.NumberFormat("ru-RU").format(Number(v || 0));
const pct = (v) => (Number.isFinite(v) ? Math.round(v * 1000) / 10 : 0).toLocaleString("ru-RU") + "%";

function fmtUptime(sec) {
  const s = Math.max(0, Math.floor(Number(sec) || 0));
  const d = Math.floor(s / 86400), h = Math.floor((s % 86400) / 3600), m = Math.floor((s % 3600) / 60);
  if (d > 0) return `${d} д ${h} ч`;
  if (h > 0) return `${h} ч ${m} мин`;
  if (m > 0) return `${m} мин`;
  return `${s} с`;
}
function relTime(ms) {
  if (!ms) return "—";
  const diff = Date.now() - Number(ms);
  if (diff < 0) return "только что";
  const m = Math.floor(diff / 60000);
  if (m < 1) return "только что";
  if (m < 60) return `${m} ${m === 1 ? "минуту" : m < 5 ? "минуты" : "минут"} назад`;
  const h = Math.floor(m / 60);
  if (h < 24) return `${h} ч назад`;
  return `${Math.floor(h / 24)} д назад`;
}
function isoIn(iso) {
  if (!iso) return "";
  const t = Date.parse(iso);
  if (!Number.isFinite(t)) return esc(iso);
  const mins = Math.round((t - Date.now()) / 60000);
  if (mins <= 0) return "скоро сбросится";
  if (mins >= 2880) return `через ${Math.round(mins / 1440)} д`;
  const h = Math.floor(mins / 60), m = mins % 60;
  if (h >= 1) return m ? `через ${h} ч ${m} мин` : `через ${h} ч`;
  return `через ${m} мин`;
}
function dayLabel(day) {
  const d = new Date(day + "T00:00:00");
  if (Number.isNaN(d.getTime())) return day;
  return d.toLocaleDateString("ru-RU", { day:"2-digit", month:"2-digit" });
}
function fmtDur(v) {
  if (!v) return "—";
  const m = /^(?:(\d+)h)?(?:(\d+)m)?(?:(\d+(?:\.\d+)?)s)?$/.exec(String(v).trim());
  if (!m) return String(v);
  const h = Number(m[1] || 0), mi = Number(m[2] || 0), s = Math.round(Number(m[3] || 0));
  const parts = [];
  if (h) parts.push(h + " ч");
  if (mi) parts.push(mi + " мин");
  if (s && !h) parts.push(s + " с");
  return parts.join(" ") || "0 с";
}
function safeUrl(u) {
  try {
    const p = new URL(u);
    return p.protocol === "https:" || p.protocol === "http:" ? p.href : "";
  } catch { return ""; }
}
function icon(id, cls = "nav-icon") {
  return `<svg class="${cls}" aria-hidden="true"><use href="#${id}"/></svg>`;
}

/* ---------- snackbar ---------- */
let snackTimer = null;
function toast(message, kind = "ok") {
  const el = $("#snackbar");
  el.className = "snackbar show" + (kind === "err" ? " err" : "");
  el.innerHTML = (kind === "err" ? icon("i-warn") : icon("i-check")) + `<span>${esc(message)}</span>`;
  clearTimeout(snackTimer);
  snackTimer = setTimeout(() => { el.className = "snackbar"; }, kind === "err" ? 6500 : 3500);
}

/* ---------- transport ---------- */
async function api(path, opts = {}) {
  const headers = { Accept: "application/json" };
  if (opts.body !== undefined) headers["Content-Type"] = "application/json";
  if (state.token) headers.Authorization = "Bearer " + state.token;
  let res;
  try {
    res = await fetch(path, { method: opts.method || "GET", headers, body: opts.body === undefined ? undefined : JSON.stringify(opts.body) });
  } catch (err) {
    throw new Error("демон не отвечает: " + err.message);
  }
  const text = await res.text();
  let data = null;
  try { data = text ? JSON.parse(text) : null; } catch { data = { error: text }; }
  if (!res.ok) {
    if (res.status === 401) openTokenDialog(true);
    const msg = (data && data.error) || `HTTP ${res.status}`;
    throw new Error(msg);
  }
  return data;
}

/* ---------- data loading ---------- */
async function loadStatus() {
  try {
    state.status = await api("/_control/status");
    state.lastAt = Date.now();
    state.errors.status = null;
  } catch (err) {
    state.errors.status = err.message;
    throw err;
  }
}
async function loadStats() {
  try { state.stats = await api("/_control/stats"); } catch { /* optional */ }
}
async function loadOptions() {
  state.options = await api("/_control/options");
}
async function loadModels(force) {
  if (state.models && !force) return;
  state.models = await api("/_control/models");
}
async function loadKeys() {
  state.keys = await api("/_control/keys");
}
async function loadQuota() {
  state.quota = await api("/_control/antigravity/quota");
}

async function refreshCurrent(force) {
  const r = state.route;
  try {
    if (r === "overview") { await loadStatus(); await loadStats(); }
    else if (r === "providers") { await Promise.all([loadStatus(), loadOptions(), loadKeys()]); }
    else if (r === "models") { await loadModels(force); await loadStatus().catch(() => {}); }
    else if (r === "quota") { await loadQuota(); }
    else if (r === "settings") { await loadOptions(); await loadStatus().catch(() => {}); }
    render();
  } catch (err) {
    renderError(err);
  }
}

function renderError(err) {
  const html = `
    <section class="page-head"><div><h1>Нет связи с демоном</h1>
      <p class="lead">Запрос к <code class="mono">/_control</code> не удался. Проверьте, что служба запущена: <code class="mono">systemctl --user status providermux</code>.</p></div></section>
    <div class="card outlined"><div class="notice danger">${icon("i-warn")}<div><b>${esc(err.message)}</b><div class="small mt3 muted">После исправления нажмите «Обновить».</div></div></div></div>`;
  $("#main").innerHTML = html;
}

/* ---------- rendering ---------- */
function render(force) {
  const active = document.activeElement;
  const typing = active && ["INPUT", "SELECT", "TEXTAREA"].includes(active.tagName) && active.closest("#main");
  if (typing && !force) return;

  const scroll = window.scrollY;
  const views = { overview: viewOverview, providers: viewProviders, models: viewModels, quota: viewQuota, settings: viewSettings };
  $("#main").innerHTML = (views[state.route] || viewOverview)();
  wireView();
  window.scrollTo(0, scroll);
  updateHealth();
  updateTokenLabel();
}

function updateHealth() {
  const pill = $("#health-pill"), txt = $("#health-text");
  if (state.errors.status && !state.status) {
    pill.className = "pill err"; txt.textContent = "нет связи";
  } else if (state.status) {
    pill.className = "pill ok";
    txt.textContent = "работает · " + fmtUptime(state.status.uptime_seconds);
  } else {
    pill.className = "pill"; txt.textContent = "проверка…";
  }
  $("#brand-sub").textContent = state.status ? state.status.listen : "панель шлюза";
}
function updateTokenLabel() {
  $("#token-label").textContent = state.token ? "Токен задан" : "Токен";
}

function pageHead(title, lead, actions = "") {
  return `<section class="page-head"><div><h1>${esc(title)}</h1>${lead ? `<p class="lead">${lead}</p>` : ""}</div><div class="spacer"></div>${actions}</section>`;
}

/* ----- overview ----- */
function viewOverview() {
  if (!state.status) return pageHead("Обзор", "Загрузка состояния…") + `<div class="card"><div class="skeleton" style="width:50%;height:20px"></div></div>`;
  const st = state.status;
  const t = st.totals_today || { ok:0, refused:0, aborted:0, by_model:[], by_address:[] };
  const total = (t.ok || 0) + (t.refused || 0) + (t.aborted || 0);
  const rate = total ? t.ok / total : 0;
  const providers = st.providers || [];

  const days = (state.stats && state.stats.days ? state.stats.days.slice(0, 7).slice().reverse() : []);
  const maxOk = Math.max(1, ...days.map((d) => d.ok || 0));
  const chart = days.length ? `
    <div class="chart">
      ${days.map((d) => {
        const h = Math.max(4, Math.round(((d.ok || 0) / maxOk) * 64));
        return `<div class="chart-col">
          <div class="chart-count">${num(d.ok)}</div>
          <div class="chart-bar" style="height:${h}px" title="${esc(d.day)}: ${num(d.ok)} ok"></div>
          <div class="chart-day">${esc(dayLabel(d.day))}</div>
        </div>`;
      }).join("")}
    </div>` : `<div class="empty">${icon("i-info")}<div>История появится после первых запросов</div></div>`;

  const addr = (st.addresses || []).map((a) => a.error
    ? `<div class="kv"><dt><span class="pill warn">${esc(a.family)}</span></dt><dd class="small muted" style="max-width:60%">${esc(a.error)}</dd></div>`
    : `<div class="kv"><dt><span class="pill accent">${esc(a.family)}</span></dt><dd><span class="mono">${esc(a.address)}</span><div class="small muted">${relTime(Date.now() - (a.age_ms || 0))}</div></dd></div>`
  ).join("") || `<div class="empty">${icon("i-warn")}<div>Адрес выхода ещё не определён</div></div>`;

  const provRows = providers.map((p) => `
    <div class="kv">
      <dt><b>${esc(p.id)}</b><div class="small muted">${esc(p.credential)}${p.key_used ? " · ключ используется" : ""}</div></dt>
      <dd><span class="badge">${num(p.free_models)}/${num(p.models)}</span><div class="small muted">ключей: ${num(p.keys)}</div></dd>
    </div>`).join("") || `<div class="empty">${icon("i-info")}<div>Провайдеры не объявлены</div></div>`;

  const byModel = (t.by_model || []).map((m) => `
    <tr><td><span class="mono">${esc(m.model)}</span></td>
      <td class="num">${num(m.ok)}</td><td class="num">${num(m.refused)}</td><td class="num hide-sm">${num(m.aborted)}</td>
      <td class="num hide-sm muted small">${relTime(m.last_seen)}</td></tr>`).join("");

  const byAddr = (t.by_address || []).map((a) => `
    <tr><td><span class="mono">${esc(a.address || "—")}</span> <span class="pill">${esc(a.family)}</span></td>
      <td class="num">${num(a.ok)}</td><td class="num">${num(a.refused)}</td><td class="num hide-sm">${num(a.aborted)}</td></tr>`).join("");

  return `
  ${pageHead("Обзор", `Сегодня ${esc(t.day || "—")} · режим <b>${esc(st.mode)}</b> · слушает <span class="mono">${esc(st.listen)}</span>`,
    `<button class="btn btn-tonal" data-act="refresh">${icon("i-refresh")}<span>Обновить</span></button>`)}

  <div class="grid">
    <div class="card"><div class="kpi"><span class="kpi-label">Успешно</span><span class="kpi-value">${num(t.ok)}</span><span class="kpi-note">ответов отдано клиентам</span></div></div>
    <div class="card"><div class="kpi"><span class="kpi-label">Отказы</span><span class="kpi-value err">${num(t.refused)}</span><span class="kpi-note">переданы дословно</span></div></div>
    <div class="card"><div class="kpi"><span class="kpi-label">Оборвано</span><span class="kpi-value">${num(t.aborted)}</span><span class="kpi-note">клиент закрыл поток</span></div></div>
    <div class="card"><div class="kpi"><span class="kpi-label">Доля успеха</span><span class="kpi-value">${pct(rate)}</span>
      <div class="bar-track mt3"><div class="bar-fill ok" style="width:${Math.round(rate*100)}%"></div></div></div></div>
  </div>

  <div class="grid two mt4">
    <section class="card"><div class="card-head"><h2 class="card-title">Динамика за неделю</h2></div>${chart}</section>
    <section class="card"><div class="card-head"><h2 class="card-title">Адреса выхода</h2><span class="pill">${esc(st.mode)}</span></div>${addr}

/* ----- providers ----- */
function providerData(id) {
  const st = (state.status && state.status.providers || []).find((p) => p.id === id) || {};
  const cur = (state.options && state.options.current && state.options.current.providers && state.options.current.providers[id]) || {};
  const keys = (state.keys && state.keys.providers || []).find((p) => p.provider === id) || {};
  return { st, cur, fingerprints: keys.keys || [] };
}

function ask(text, okLabel = "Удалить") {
  const dialog = $("#confirm-dialog");
  $("#confirm-text").textContent = text;
  $("#confirm-ok").textContent = okLabel;
  dialog.returnValue = "";
  dialog.showModal();
  return new Promise((resolve) => {
    dialog.addEventListener("close", () => resolve(dialog.returnValue === "ok"), { once: true });
  });
}

function segmented(name, values, current, attrs) {
  return `<div class="segmented" role="radiogroup" aria-label="${esc(name)}">${values.map((v) =>
    `<button type="button" role="radio" aria-checked="${v === current}" ${attrs} data-value="${esc(v)}">${esc(v)}</button>`).join("")}</div>`;
}

  return `

/* ---------- view wiring ---------- */
function wireView() {
  const main = $("#main");
  const search = $("#model-search", main);
  if (search) {
    search.addEventListener("input", (e) => {
      state.modelQuery = e.target.value;
      const at = e.target.selectionStart;
      render(true);
      const again = $("#model-search");
      if (again) { again.focus(); again.setSelectionRange(at, at); }
    });
  }
  $$(".segmented[role='radiogroup']", main).forEach((group) => {
    const radios = $$("button[role='radio']", group);
    const current = radios.findIndex((b) => b.getAttribute("aria-checked") === "true");
    radios.forEach((b, i) => { b.tabIndex = i === Math.max(0, current) ? 0 : -1; });
    group.addEventListener("keydown", (e) => {
      const step = e.key === "ArrowRight" || e.key === "ArrowDown" ? 1 : e.key === "ArrowLeft" || e.key === "ArrowUp" ? -1 : 0;
      if (!step) return;
      e.preventDefault();
      const at = radios.indexOf(document.activeElement);
      const next = radios[(at + step + radios.length) % radios.length];
      radios.forEach((b) => { b.tabIndex = b === next ? 0 : -1; });
      next.focus();
      next.click();
    });
  });
  $$("select[data-act]", main).forEach((sel) => {
    sel.addEventListener("change", () => {
      if (sel.dataset.act === "set-account") setAxis(sel.dataset.provider, "account", sel.value, "account-" + sel.dataset.provider);
      else setAxis(sel.dataset.provider, sel.dataset.axis, sel.value, sel.dataset.axis + "-" + sel.dataset.provider);
    });
  });
  $$("form[id^='keyform-']", main).forEach((form) => {
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const provider = form.dataset.provider;
      const input = form.querySelector("input[name='key']");
      const key = input.value.trim();
      if (!key) return;
      input.value = "";
      try {
        await api("/_control/keys/add", { method:"POST", body:{ provider, key } });
        toast(`Ключ добавлен: ${provider}`);
        await loadKeys(); await loadStatus();
        render();
      } catch (err) { toast(err.message, "err"); }
    });
  });
  const oauth = $("#oauth-form", main);  if (oauth) {
    oauth.addEventListener("submit", async (e) => {
      e.preventDefault();
      const raw = $("#oauth-code").value.trim();
      const project = $("#oauth-project").value.trim();
      if (!raw) return;
      let code = raw, redirect = "";
      if (/^https?:\/\//i.test(raw)) {
        try {
          const u = new URL(raw);
          code = u.searchParams.get("code") || "";
          redirect = u.origin + u.pathname;
        } catch { /* keep raw */ }
      }
      if (!code) { toast("В адресе нет параметра code", "err"); return; }
      const body = { code, verifier: state.oauth ? state.oauth.verifier : "" };
      if (redirect) body.redirect_uri = redirect;
      if (project) body.project_id = project;
      try {
        await api("/_control/antigravity/oauth/exchange", { method:"POST", body });
        toast("Ключ получен и добавлен в пул");
        state.oauth = null;
        await loadQuota(); await loadStatus().catch(() => {});
        render();
      } catch (err) { toast(err.message, "err"); }
    });
  }
}

/* ---------- actions ---------- */
async function setAxis(provider, axis, value, busyKey) {
  state.busy.add(busyKey);
  render();
  const body = provider ? { provider, axis, value } : { axis, value };
  try {
    await api("/_control/options", { method:"POST", body });
    await loadOptions();
    toast(`${provider ? provider + ": " : ""}${axis} → ${value || "авто"}`);
  } catch (err) {
    toast(err.message, "err");
  } finally {
    state.busy.delete(busyKey);
    if (state.route === "providers") await loadStatus().catch(() => {});
    render();
  }
}

document.addEventListener("click", async (e) => {
  const el = e.target.closest("[data-act]");
  if (!el) return;
  const act = el.dataset.act;

  if (act === "refresh") { await refreshCurrent(true); return; }
  if (act === "refresh-force") {
    try { await loadModels(true); render(); } catch (err) { toast(err.message, "err"); }
    return;
  }
  if (act === "theme") { cycleTheme(); return; }
  if (act === "token-open") { openTokenDialog(false); return; }
  if (act === "token-save") {
    e.preventDefault();
    state.token = $("#token-input").value.trim();
    localStorage.setItem("pmux_token", state.token);
    $("#token-dialog").close();
    updateTokenLabel();
    toast(state.token ? "Токен сохранён" : "Токен очищен");
    await refreshCurrent(true);
    return;
  }
  if (act === "token-clear") {
    e.preventDefault();
    state.token = "";
    localStorage.removeItem("pmux_token");
    $("#token-input").value = "";
    $("#token-dialog").close();
    updateTokenLabel();
    toast("Токен очищен");
    return;
  }
  if (act === "set-global") {
    const value = el.dataset.value;
    if (el.getAttribute("aria-checked") === "true") return;
    await setAxis("", el.dataset.axis, value, "g-" + el.dataset.axis);
    return;
  }
  if (act === "set-axis") {
    if (el.tagName === "SELECT") return; /* the change listener owns selects */
    const { provider, axis } = el.dataset;
    const value = el.dataset.value;
    await setAxis(provider, axis, value, axis + "-" + provider);
    return;
  }
  if (act === "set-account") {
    return; /* the change listener owns selects */
  }
  if (act === "toggle-rotation") {
    const provider = el.dataset.provider;
    const next = el.getAttribute("aria-checked") === "true" ? "off" : "on";
    await setAxis(provider, "key_rotation", next, "key_rotation-" + provider);
    return;
  }
  if (act === "remove-key") {
    const { provider, key } = el.dataset;
    if (!(await ask(`Удалить ключ ${key} из пула «${provider}»? Вернуть его можно только вставкой заново.`))) return;
    try {
      await api("/_control/keys/remove", { method:"POST", body:{ provider, key } });
      toast(`Ключ ${key} удалён`);
      await loadKeys(); await loadStatus();
      render();
    } catch (err) { toast(err.message, "err"); }
    return;
  }
  if (act === "copy") {
    const text = el.dataset.copy;
    try {
      await navigator.clipboard.writeText(text);
      toast(`Скопировано: ${text}`);
    } catch { toast("Буфер обмена недоступен", "err"); }
    return;
  }
  if (act === "filter-provider") {
    state.modelProvider = el.dataset.value;
    render();
    return;
  }
  if (act === "reset-filter") {
    state.modelQuery = ""; state.modelProvider = ""; render(); return;
  }
  if (act === "oauth-start") {
    try {
      const res = await api("/_control/antigravity/oauth/start", { method:"POST", body:{ provider:"antigravity" } });
      state.oauth = { ...res, started:true };
      toast("Страница входа открыта в новой вкладке");
      const target = safeUrl(res.auth_url); if (target) window.open(target, "_blank", "noopener");
      render();
    } catch (err) { toast(err.message, "err"); }
    return;
  }
});

/* ---------- theme ---------- */
function applyTheme() {
  if (state.theme === "auto") document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme", state.theme);
  const btn = $("#btn-theme");
  if (btn) btn.innerHTML = icon(state.theme === "dark" ? "i-sun" : "i-moon");
  const meta = document.querySelector('meta[name="theme-color"]:not([media])');
  if (meta) meta.setAttribute("content", state.theme === "dark" ? "#121318" : "#FBF8FD");
}
function cycleTheme() {
  state.theme = state.theme === "auto" ? "light" : state.theme === "light" ? "dark" : "auto";
  localStorage.setItem("pmux_theme", state.theme);
  applyTheme();
  if (state.route === "settings") render();
}

/* ---------- dialogs ---------- */
let lastFocus = null;
function openTokenDialog(unauthorized) {
  const dlg = $("#token-dialog");
  lastFocus = document.activeElement;
  $("#token-input").value = state.token;
  dlg.showModal();
  $("#token-input").focus();
  if (unauthorized) toast("Нужен токен: демон ответил 401", "err");
  dlg.addEventListener("close", () => { if (lastFocus) lastFocus.focus(); }, { once:true });
}

/* ---------- routing ---------- */
function buildNav() {
  const items = ROUTES.map((r) => `
    <a href="#${r.id}" class="rail-item" data-route="${r.id}">
      ${icon(r.icon)}<span>${r.label}</span>
    </a>`).join("");
  $("#rail").innerHTML = items;
  $("#bottom-nav").innerHTML = ROUTES.map((r) => `
    <a href="#${r.id}" class="bottom-item" data-route="${r.id}">
      ${icon(r.icon)}<span>${r.label}</span>
    </a>`).join("");
}
function routeFromHash() {
  const id = (location.hash || "").replace(/^#\/?/, "");
  return ROUTES.some((r) => r.id === id) ? id : "overview";
}
function applyRoute() {
  state.route = routeFromHash();
  const meta = ROUTES.find((r) => r.id === state.route);
  document.title = (meta ? meta.title + " · " : "") + "providermux";
  $$("[data-route]").forEach((a) => {
    if (a.dataset.route === state.route) a.setAttribute("aria-current", "page");
    else a.removeAttribute("aria-current");
  });
  refreshCurrent(false);
}

/* ---------- boot ---------- */
function boot() {
  const params = new URLSearchParams(location.search);
  const urlToken = params.get("token");
  state.token = urlToken || localStorage.getItem("pmux_token") || "";
  if (urlToken) {
    localStorage.setItem("pmux_token", urlToken);
    params.delete("token");
    const qs = params.toString();
    history.replaceState(null, "", location.pathname + (qs ? "?" + qs : "") + location.hash);
  }
  state.theme = localStorage.getItem("pmux_theme") || "auto";
  applyTheme();
  buildNav();
  updateTokenLabel();
  window.addEventListener("hashchange", applyRoute);
  $("#token-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    state.token = $("#token-input").value.trim();
    if (state.token) localStorage.setItem("pmux_token", state.token);
    else localStorage.removeItem("pmux_token");
    $("#token-dialog").close();
    updateTokenLabel();
    toast(state.token ? "Токен сохранён" : "Токен очищен");
    await refreshCurrent(true);
  });
  applyRoute();
  setInterval(() => {
    if (document.visibilityState !== "visible") return;
    if (!["overview", "providers"].includes(state.route)) return;
    refreshCurrent(false);
  }, POLL_MS);
}

if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot);
else boot();
</script>
</body>
