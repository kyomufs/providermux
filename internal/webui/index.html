<style>
/* ============ tokens: Material 3 roles over a muted blue-grey seed ============ */
/* One accent, tonal surfaces, no gradients and no blur: the palette carries
   hierarchy, not effects. Values are M3 tone approximations of a #3C5566 seed. */
:root {
  color-scheme: light;
  --primary:#3C5566;              --on-primary:#FFFFFF;
  --primary-container:#D3E4EE;    --on-primary-container:#0B2A38;
  --secondary:#516069;            --on-secondary:#FFFFFF;
  --secondary-container:#D6E4EC;  --on-secondary-container:#0D1F27;
  --surface:#FAF9F7;              --on-surface:#1B1C1A;
  --surface-dim:#DAD9D7;          --surface-bright:#FAF9F7;
  --surface-lowest:#FFFFFF;       --surface-low:#F5F4F1;
  --surface-container:#EFEEE9;    --surface-high:#E9E8E3;
  --surface-highest:#E3E2DD;
  --on-surface-variant:#44474A;   --outline:#74777B;   --outline-variant:#C4C7CA;
  --inverse-surface:#30312F;      --inverse-on-surface:#F1F1ED;
  --ok:#3E6A4F;                   --ok-container:#DCE9E0;  --on-ok-container:#0C2415;
  --warn:#7A5C1E;                 --warn-container:#EFE4CB;--on-warn-container:#271A00;
  --error:#A23B32;                --on-error:#FFFFFF;
  --error-container:#F5DDD9;      --on-error-container:#3B0A06;
  --scrim:rgba(20,20,18,.32);
  --shadow-1:0 1px 2px rgba(0,0,0,.08), 0 1px 3px 1px rgba(0,0,0,.06);
  --shadow-2:0 2px 6px rgba(0,0,0,.10), 0 1px 2px rgba(0,0,0,.08);

  /* M3 shape scale */
  --r-xs:4px; --r-sm:8px; --r-md:12px; --r-lg:16px; --r-xl:28px; --r-full:999px;
  /* 4dp grid */
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px; --s7:40px;
  --dur:100ms; --ease:cubic-bezier(.2,0,0,1);
  --font:"Inter","SF Pro Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"JetBrains Mono","SF Mono",ui-monospace,monospace;
  --appbar-h:64px; --rail-w:220px;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --primary:#A9C9DB;            --on-primary:#0C3546;
    --primary-container:#24495A;  --on-primary-container:#C5E7FA;
    --secondary:#B7C9D3;          --on-secondary:#22333B;
    --secondary-container:#364750;--on-secondary-container:#D3E5EF;
    --surface:#111413;            --on-surface:#E2E3E0;
    --surface-dim:#111413;        --surface-bright:#373A38;
    --surface-lowest:#0C0F0E;     --surface-low:#191C1B;
    --surface-container:#1D201F;  --surface-high:#272A29;
    --surface-highest:#323534;
    --on-surface-variant:#BFC6C9; --outline:#899398;  --outline-variant:#3F484C;
    --inverse-surface:#E2E3E0;    --inverse-on-surface:#2E312F;
    --ok:#9FCFAC;                  --ok-container:#1D3A28;  --on-ok-container:#BBEBC8;
    --warn:#DCC38A;                --warn-container:#3F2F0A;--on-warn-container:#F8E0A8;
    --error:#F2B8B0;               --on-error:#601410;
    --error-container:#8C1D18;     --on-error-container:#FFDAD5;
    --scrim:rgba(0,0,0,.52);
    --shadow-1:0 1px 2px rgba(0,0,0,.5), 0 1px 3px 1px rgba(0,0,0,.35);
    --shadow-2:0 2px 6px rgba(0,0,0,.55), 0 1px 2px rgba(0,0,0,.4);
  }
}
html[data-theme="light"] {
  color-scheme:light;
  --primary:#3C5566; --on-primary:#FFFFFF; --primary-container:#D3E4EE; --on-primary-container:#0B2A38;
  --secondary:#516069; --on-secondary:#FFFFFF; --secondary-container:#D6E4EC; --on-secondary-container:#0D1F27;
  --surface:#FAF9F7; --on-surface:#1B1C1A; --surface-dim:#DAD9D7; --surface-bright:#FAF9F7;
  --surface-lowest:#FFFFFF; --surface-low:#F5F4F1; --surface-container:#EFEEE9;
  --surface-high:#E9E8E3; --surface-highest:#E3E2DD;
  --on-surface-variant:#44474A; --outline:#74777B; --outline-variant:#C4C7CA;
  --inverse-surface:#30312F; --inverse-on-surface:#F1F1ED;
  --ok:#3E6A4F; --ok-container:#DCE9E0; --on-ok-container:#0C2415;
  --warn:#7A5C1E; --warn-container:#EFE4CB; --on-warn-container:#271A00;
  --error:#A23B32; --on-error:#FFFFFF; --error-container:#F5DDD9; --on-error-container:#3B0A06;
  --scrim:rgba(20,20,18,.32);
  --shadow-1:0 1px 2px rgba(0,0,0,.08), 0 1px 3px 1px rgba(0,0,0,.06);
  --shadow-2:0 2px 6px rgba(0,0,0,.10), 0 1px 2px rgba(0,0,0,.08);
}
html[data-theme="dark"] {
  color-scheme:dark;
  --primary:#A9C9DB; --on-primary:#0C3546; --primary-container:#24495A; --on-primary-container:#C5E7FA;
  --secondary:#B7C9D3; --on-secondary:#22333B; --secondary-container:#364750; --on-secondary-container:#D3E5EF;
  --surface:#111413; --on-surface:#E2E3E0; --surface-dim:#111413; --surface-bright:#373A38;
  --surface-lowest:#0C0F0E; --surface-low:#191C1B; --surface-container:#1D201F;
  --surface-high:#272A29; --surface-highest:#323534;
  --on-surface-variant:#BFC6C9; --outline:#899398; --outline-variant:#3F484C;
  --inverse-surface:#E2E3E0; --inverse-on-surface:#2E312F;
  --ok:#9FCFAC; --ok-container:#1D3A28; --on-ok-container:#BBEBC8;
  --warn:#DCC38A; --warn-container:#3F2F0A; --on-warn-container:#F8E0A8;
  --error:#F2B8B0; --on-error:#601410; --error-container:#8C1D18; --on-error-container:#FFDAD5;
  --scrim:rgba(0,0,0,.52);
  --shadow-1:0 1px 2px rgba(0,0,0,.5), 0 1px 3px 1px rgba(0,0,0,.35);
  --shadow-2:0 2px 6px rgba(0,0,0,.55), 0 1px 2px rgba(0,0,0,.4);
}

/* ============ reset ============ */
*,*::before,*::after { box-sizing:border-box; }
html,body { margin:0; padding:0; }
/* The sprite at the top of the body is <svg hidden>. Author rules beat the UA
   sheet regardless of specificity, so svg{display:block} would render it as a
   300x150 block — a blank band above the app bar. */
[hidden] { display:none !important; }
body {
  background:var(--surface); color:var(--on-surface);
  font-family:var(--font); font-size:14px; line-height:20px;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  min-height:100dvh;
}
h1,h2,h3,h4,p { margin:0; }
button,input,select,textarea { font:inherit; color:inherit; }
button { cursor:pointer; background:none; border:0; }
svg { display:block; }
:focus-visible { outline:2px solid var(--primary); outline-offset:2px; border-radius:var(--r-xs); }
::selection { background:var(--primary-container); color:var(--on-primary-container); }

.skip {
  position:fixed; left:12px; top:-56px; z-index:100;
  background:var(--primary); color:var(--on-primary);
  padding:10px 16px; border-radius:var(--r-sm); text-decoration:none;
  transition:top var(--dur) var(--ease);
}
.skip:focus { top:12px; }

/* ============ shell: M3 small top app bar + navigation drawer ============ */
.appbar {
  position:sticky; top:0; z-index:30;
  display:flex; align-items:center; gap:var(--s4);
  height:var(--appbar-h); padding:0 var(--s4);
  background:var(--surface);
  border-bottom:1px solid var(--outline-variant);
}
.brand { display:flex; align-items:center; gap:12px; min-width:0; }
.brand-mark {
  width:32px; height:32px; border-radius:var(--r-sm); flex:none;
  display:grid; place-items:center; color:var(--on-primary-container);
  background:var(--primary-container);
}
.brand-mark .nav-icon { width:18px; height:18px; }
.brand-name { display:block; font-size:16px; line-height:22px; font-weight:500; letter-spacing:.01em; }
.brand-sub { display:block; font-size:11px; line-height:16px; color:var(--on-surface-variant); }
.appbar-spacer { flex:1; }
/* Right cluster on a single 32px line: a 40px icon button next to a 24px pill
   reads as a staggered row even when every centre is the same. */
.appbar .btn-icon { width:32px; height:32px; }
.appbar .pill { height:32px; padding:0 var(--s3); }
/* When the last successful read happened. The counters below it refresh on a
   timer, so without a stamp one cannot tell a quiet gateway from a dead poll. */
.stamp { font-size:11.5px; line-height:16px; color:var(--on-surface-variant); white-space:nowrap; font-variant-numeric:tabular-nums; }

.shell { display:flex; min-height:calc(100dvh - var(--appbar-h)); }
.rail {
  width:var(--rail-w); flex:none; padding:var(--s3) var(--s2) var(--s5);
  display:flex; flex-direction:column; gap:2px;
  border-right:1px solid var(--outline-variant); background:var(--surface-low);
  position:sticky; top:var(--appbar-h); height:calc(100dvh - var(--appbar-h));
  overflow-y:auto;
}
/* M3 drawer item: full pill, active = secondary-container, icon on accent. */
.rail-item, .bottom-item {
  display:flex; align-items:center; justify-content:flex-start; gap:12px;
  width:100%; min-height:40px; padding:6px 14px; border-radius:var(--r-full);
  color:var(--on-surface-variant); font-size:13px; line-height:18px; text-align:left;
  transition:background var(--dur) var(--ease), color var(--dur) var(--ease);
}
.rail-item:hover, .bottom-item:hover { background:var(--surface-container); color:var(--on-surface); }
.rail-item[aria-current="page"], .bottom-item[aria-current="page"] {
  background:var(--secondary-container); color:var(--on-secondary-container); font-weight:500;
}
.rail-item[aria-current="page"] .nav-icon { color:var(--primary); }
.nav-icon { width:18px; height:18px; flex:none; }
/* The drawer's own footer: address, version, uptime. A nav column with nothing
   under the last item reads as a broken layout, and these are the three facts
   one wants before touching any control. */
.rail-foot {
  margin-top:auto; padding:var(--s3) var(--s3) 0;
  border-top:1px solid var(--outline-variant);
  display:flex; flex-direction:column; gap:4px;
  font-size:11px; line-height:16px; color:var(--on-surface-variant);
}
.rail-foot b { font-weight:500; color:var(--on-surface); }
/* A refresh that repaints nothing is indistinguishable from a dead button, so
   the press itself has to be visible: the icon turns while the request is out. */
@keyframes pmux-spin { to { transform:rotate(360deg); } }
.is-loading .nav-icon { animation:pmux-spin 900ms linear infinite; }

main {
  flex:1; min-width:0; max-width:1120px; padding:var(--s5) var(--s5) var(--s6);
  margin:0 auto; width:100%;
}
.bottom-nav { display:none; }

/* ============ page furniture ============ */
/* A rule under the title costs one line and gives the screen a top edge; without
   it the heading floats in the same grey as the cards and the page reads flat. */
.page-head {
  display:flex; align-items:center; gap:var(--s4); flex-wrap:wrap;
  min-height:var(--s7); margin-bottom:var(--s5);
  padding-bottom:var(--s4); border-bottom:1px solid var(--outline-variant);
}
.page-head h1 { font-size:22px; line-height:28px; font-weight:600; letter-spacing:-.015em; }
.page-head .lead { color:var(--on-surface-variant); font-size:13px; line-height:19px; max-width:72ch; margin-top:2px; }
.page-head .spacer { flex:1; }

.grid { display:grid; gap:var(--s4); grid-template-columns:repeat(auto-fit,minmax(min(240px,100%),1fr)); }
.grid.kpi-grid { grid-template-columns:repeat(4,minmax(0,1fr)); }
.grid.two { grid-template-columns:repeat(auto-fit,minmax(min(400px,100%),1fr)); }
/* A 2:1 split keeps a chart or a table next to a short side card without the
   ragged bottom an auto-fit pair produces when the two sides differ in height. */
.grid.split { grid-template-columns:minmax(0,2fr) minmax(0,1fr); }
.stack { display:flex; flex-direction:column; gap:var(--s3); }
.row { display:flex; align-items:center; gap:var(--s3); flex-wrap:wrap; }
.muted { color:var(--on-surface-variant); }
.small { font-size:12px; line-height:17px; }
/* Grid and flex children shrink to their content by default, so one wide
   child (a long URL, a chart) stretches the whole card instead of wrapping. */
.grid > * { min-width:0; }
/* Paired cards share a row, so they must share a height: a short card sitting
   next to a long one leaves a visible notch in an otherwise flat grid. */
.grid > .card { height:100%; }
.mono { font-family:var(--mono); font-size:12px; letter-spacing:-.01em; overflow-wrap:anywhere; }
.mt3 { margin-top:var(--s3); } .mt4 { margin-top:var(--s4); }
.sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; border:0; }

/* Every card is the same raised surface on the same page ground: a second card
   variant that differs only in background makes two identical panels look like
   they belong to different designs. */
.card {
  background:var(--surface-lowest); border:1px solid var(--outline-variant);
  border-radius:var(--r-md); padding:var(--s4);
}
.card.outlined { background:var(--surface-lowest); }
.card-head { display:flex; align-items:center; gap:var(--s2); min-height:24px; margin-bottom:var(--s4); }
.card-title { font-size:14px; line-height:20px; font-weight:600; }
.card-sub { font-size:12px; line-height:17px; color:var(--on-surface-variant); }

/* ============ chips, badges, key-value ============ */
.pill {
  display:inline-flex; align-items:center; gap:6px;
  height:24px; padding:0 10px; border-radius:var(--r-sm);
  border:1px solid var(--outline-variant);
  background:transparent; color:var(--on-surface-variant);
  font-size:11px; line-height:16px; font-weight:500; white-space:nowrap;
}
.pill .dot { width:6px; height:6px; border-radius:var(--r-full); background:currentColor; flex:none; }
.pill.ok { color:var(--ok); border-color:color-mix(in srgb, var(--ok) 40%, transparent); background:color-mix(in srgb, var(--ok-container) 55%, transparent); }
.pill.err { color:var(--error); border-color:color-mix(in srgb, var(--error) 40%, transparent); background:color-mix(in srgb, var(--error-container) 55%, transparent); }
.pill.accent { color:var(--primary); border-color:color-mix(in srgb, var(--primary) 40%, transparent); background:color-mix(in srgb, var(--primary-container) 55%, transparent); }
.pill.warn { color:var(--warn); border-color:color-mix(in srgb, var(--warn) 40%, transparent); background:color-mix(in srgb, var(--warn-container) 55%, transparent); }
.chip {
  display:inline-flex; align-items:center; gap:6px; max-width:100%;
  height:28px; padding:0 10px; border-radius:var(--r-sm);
  background:var(--surface-low); border:1px solid var(--outline-variant);
  font-size:11.5px; line-height:16px;
}
.chip button { color:var(--on-surface-variant); display:grid; place-items:center; border-radius:var(--r-full); }
.chip button:hover { color:var(--error); }
.badge {
  display:inline-flex; align-items:center; justify-content:center;
  min-width:20px; height:18px; padding:0 6px; border-radius:var(--r-full);
  background:var(--secondary-container); color:var(--on-secondary-container);
  font-size:11px; font-weight:500; font-variant-numeric:tabular-nums;
}
/* Centre, not baseline: a 24px pill in dt would otherwise drop the whole row. */
.kv { display:flex; align-items:center; justify-content:space-between; gap:var(--s3); min-height:40px; padding:8px 0; border-bottom:1px solid var(--outline-variant); }
.kv:last-child { border-bottom:0; }
.kv dt { color:var(--on-surface-variant); font-size:12.5px; }
.kv dd { margin:0; min-width:0; font-size:12.5px; font-weight:500; text-align:right; overflow-wrap:anywhere; }

/* ============ KPI ============ */
/* Equal height so the card carrying a bar instead of a note lines up with its row. */
.kpi { display:flex; flex-direction:column; gap:2px; min-height:72px; }
.kpi-label { font-size:11px; line-height:16px; letter-spacing:.05em; text-transform:uppercase; color:var(--on-surface-variant); }
.kpi-value { font-size:30px; line-height:38px; font-weight:600; letter-spacing:-.02em; font-variant-numeric:tabular-nums; }
.kpi-value.err { color:var(--error); }
.kpi-note { font-size:11.5px; line-height:16px; color:var(--on-surface-variant); }

/* ============ buttons: M3 filled / tonal / outlined / text / icon ============ */
.btn {
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  height:40px; padding:0 20px; border:1px solid transparent; border-radius:var(--r-full);
  font-size:14px; line-height:20px; font-weight:500; letter-spacing:.01em; white-space:nowrap;
  transition:background var(--dur) var(--ease), border-color var(--dur) var(--ease), color var(--dur) var(--ease);
}
.btn .nav-icon { width:18px; height:18px; }
.btn:disabled { opacity:.38; cursor:not-allowed; }
.btn-filled { background:var(--primary); color:var(--on-primary); }
.btn-filled:hover:not(:disabled) { background:color-mix(in srgb, var(--primary) 92%, var(--on-surface)); }
.btn-tonal { background:var(--secondary-container); color:var(--on-secondary-container); }
.btn-tonal:hover:not(:disabled) { background:color-mix(in srgb, var(--secondary-container) 90%, var(--on-secondary-container)); }
.btn-outlined { border-color:var(--outline); color:var(--primary); }
.btn-outlined:hover:not(:disabled) { background:var(--surface-container); }
.btn-text { color:var(--primary); padding:0 12px; }
.btn-text:hover:not(:disabled) { background:var(--surface-container); }
.btn-danger { background:var(--error-container); color:var(--on-error-container); }
.btn-icon { width:40px; height:40px; padding:0; color:var(--on-surface-variant); border-radius:var(--r-full); }
.btn-icon:hover { background:var(--surface-container); color:var(--on-surface); }
.btn-sm { height:32px; padding:0 14px; font-size:13px; }
.btn-sm .nav-icon { width:16px; height:16px; }
/* .btn-sm would otherwise stretch an icon button to 40x32 with 14px side padding. */
.btn-icon.btn-sm { width:32px; height:32px; padding:0; }

/* ============ form controls ============ */
.field { display:flex; flex-direction:column; gap:4px; }
.label { font-size:11px; line-height:16px; letter-spacing:.05em; text-transform:uppercase; color:var(--on-surface-variant); font-weight:500; }
.input, .select, .textarea {
  height:40px; padding:0 12px; border-radius:var(--r-xs);
  background:var(--surface-lowest); color:var(--on-surface);
  border:1px solid var(--outline);
  transition:border-color var(--dur) var(--ease);
  width:100%;
}
.textarea { height:auto; min-height:72px; padding:10px 12px; resize:vertical; }
.input:hover, .select:hover, .textarea:hover { border-color:var(--on-surface); }
.input:focus, .select:focus, .textarea:focus { border-color:var(--primary); outline:2px solid var(--primary); outline-offset:-1px; }
.hint { font-size:11.5px; line-height:16px; color:var(--on-surface-variant); }

/* M3 segmented button: outlined pill, selected segment = secondary-container. */
.segmented {
  display:inline-flex; border:1px solid var(--outline);
  border-radius:var(--r-full); overflow:hidden; background:transparent;
}
.segmented button {
  height:38px; padding:0 14px; font-size:13px; line-height:20px; font-weight:500;
  color:var(--on-surface); white-space:nowrap;
  border-left:1px solid var(--outline);
  transition:background var(--dur) var(--ease), color var(--dur) var(--ease);
}
.segmented button:first-child { border-left:0; }
.segmented button:hover:not(:disabled) { background:var(--surface-container); }
.segmented button[aria-checked="true"], .segmented button[aria-pressed="true"] {
  background:var(--secondary-container); color:var(--on-secondary-container); font-weight:500;
}
.segmented button:disabled { opacity:.38; cursor:not-allowed; }

/* M3 switch: 52x32 track, 16dp thumb, 24dp when on. */
.switch {
  position:relative; width:52px; height:32px; flex:none; border-radius:var(--r-full);
  background:var(--surface-highest); border:1px solid var(--outline);
  transition:background var(--dur) var(--ease), border-color var(--dur) var(--ease);
}
.switch::after {
  content:""; position:absolute; top:50%; left:8px; width:16px; height:16px;
  margin-top:-8px; border-radius:var(--r-full); background:var(--outline);
  transition:left var(--dur) var(--ease), width var(--dur) var(--ease),
             height var(--dur) var(--ease), margin var(--dur) var(--ease),
             background var(--dur) var(--ease);
}
.switch[aria-checked="true"] { background:var(--primary); border-color:var(--primary); }
.switch[aria-checked="true"]::after {
  left:24px; width:24px; height:24px; margin-top:-12px; background:var(--on-primary);
}
.switch:disabled { opacity:.38; cursor:not-allowed; }

/* ============ tables ============ */
.table-wrap { overflow-x:auto; border-radius:var(--r-md); }
table { width:100%; border-collapse:collapse; font-size:12.5px; }
th, td { text-align:left; vertical-align:middle; padding:10px 12px; }
thead th {
  height:36px; padding:0 12px;
  font-size:10.5px; line-height:16px; letter-spacing:.08em; text-transform:uppercase; font-weight:600;
  color:var(--on-surface-variant); border-bottom:1px solid var(--outline);
  position:sticky; top:0; background:var(--surface-low); z-index:1;
}
tbody tr { border-bottom:1px solid var(--outline-variant); }
tbody tr:last-child { border-bottom:0; }
tbody tr:hover { background:var(--surface-low); }
td.num, th.num { text-align:right; font-variant-numeric:tabular-nums; }

/* ============ bars and chart ============ */
.bar-track { height:8px; border-radius:var(--r-full); background:var(--surface-highest); overflow:hidden; }
.bar-fill { height:100%; border-radius:var(--r-full); background:var(--primary); transition:width var(--dur) linear; }
.bar-fill.ok { background:var(--ok); }
.bar-fill.warn { background:var(--warn); }
.bar-fill.err { background:var(--error); }

.chart { display:flex; align-items:flex-end; gap:8px; height:96px; padding-top:4px; border-bottom:1px solid var(--outline-variant); }
.chart-col { flex:1; display:flex; flex-direction:column; justify-content:flex-end; gap:4px; align-items:center; min-width:0; }
.chart-count { font-size:11px; font-variant-numeric:tabular-nums; color:var(--on-surface-variant); white-space:nowrap; }
.chart-bar { width:100%; max-width:48px; border-radius:var(--r-xs) var(--r-xs) 0 0; background:var(--primary); }
.chart-day { font-size:11px; color:var(--on-surface-variant); white-space:nowrap; }

/* ============ states ============ */
.empty { display:flex; flex-direction:column; align-items:center; gap:8px; padding:var(--s6) var(--s4); text-align:center; color:var(--on-surface-variant); }
.empty svg { width:20px; height:20px; opacity:.6; }
.notice {
  display:flex; gap:10px; padding:12px 14px; border-radius:var(--r-sm);
  background:var(--primary-container); color:var(--on-primary-container);
  font-size:13px; line-height:19px;
}
.notice.danger { background:var(--error-container); color:var(--on-error-container); }
.notice svg { width:16px; height:16px; flex:none; margin-top:2px; }

.skeleton { background:var(--surface-container); border-radius:var(--r-xs); height:16px; }

/* ============ snackbar + dialog ============ */
.snackbar {
  position:fixed; left:50%; bottom:24px; transform:translate(-50%, 12px);
  max-width:min(560px, calc(100vw - 32px));
  display:flex; align-items:flex-start; gap:10px;
  padding:12px 16px; border-radius:var(--r-xs);
  background:var(--inverse-surface); color:var(--inverse-on-surface);
  box-shadow:var(--shadow-2);
  font-size:13px; line-height:19px;
  opacity:0; pointer-events:none; z-index:60;
  transition:opacity var(--dur) var(--ease), transform var(--dur) var(--ease);
}
.snackbar.show { opacity:1; transform:translate(-50%,0); pointer-events:auto; }
.snackbar.err { border-left:3px solid var(--error); }
.snackbar svg { width:16px; height:16px; flex:none; margin-top:2px; }

dialog {
  border:0; padding:0; border-radius:var(--r-xl);
  background:var(--surface-high); color:var(--on-surface);
  max-width:min(520px, calc(100vw - 32px)); width:100%;
  box-shadow:var(--shadow-2);
}
dialog::backdrop { background:var(--scrim); }
.dialog-body { padding:var(--s5); display:flex; flex-direction:column; gap:var(--s4); }
.dialog-title { font-size:20px; line-height:26px; font-weight:500; }
.dialog-actions { display:flex; justify-content:flex-end; gap:8px; }

/* ============ responsive ============ */
@media (max-width: 860px) {
  .rail { display:none; }
  main { padding:var(--s4) var(--s4) 88px; }
  .appbar { padding:0 var(--s3); }
  .bottom-nav {
    display:flex; position:fixed; bottom:0; left:0; right:0; z-index:40;
    background:var(--surface-container);
    border-top:1px solid var(--outline-variant);
    padding:4px 6px calc(4px + env(safe-area-inset-bottom)); gap:2px;
  }
  .bottom-item {
    flex-direction:column; gap:3px; min-height:56px; padding:6px 2px;
    border-radius:var(--r-sm); font-size:10.5px; line-height:14px;
    text-align:center; justify-content:center;
  }
  .bottom-item[aria-current="page"] {
    /* A tab bar has no drawer pill to fill, so the active tab is marked by its
       icon container instead of a full-width highlight. */
    background:transparent; color:var(--on-secondary-container);
  }
  .bottom-item[aria-current="page"] .nav-icon {
    background:var(--secondary-container); border-radius:var(--r-full);
    padding:5px; width:28px; height:28px;
  }
  .page-head h1 { font-size:20px; line-height:26px; }
  .hide-sm { display:none; }
  .snackbar { bottom:76px; }
  .grid.kpi-grid { grid-template-columns:repeat(2,minmax(0,1fr)); }
  /* One column: a 2:1 split on a tablet squeezes the narrow side into a strip. */
  .grid.split { grid-template-columns:minmax(0,1fr); }
  .stamp { display:none; }
}
@media (max-width: 560px) {
  /* On a phone the bar fits only the mark, two icons and one action; the
     health pill and the address line live on the overview screen instead. */
  .brand-sub { display:none; }
  .brand-name { white-space:nowrap; }
  .appbar { gap:var(--s2); }
  .appbar .pill { display:none; }
  .grid { grid-template-columns:1fr; }
  .grid.kpi-grid { grid-template-columns:repeat(2,minmax(0,1fr)); }
  .kpi-value { font-size:24px; line-height:32px; }
}
@media (max-width: 400px) {
  .appbar .btn-sm span { display:none; }
  .appbar .btn-sm { width:40px; padding:0; }
}
@media (prefers-reduced-motion: reduce) {
  *,*::before,*::after { animation-duration:.001ms !important; transition-duration:.001ms !important; }
}
</style>

<script>
"use strict";

/* ---------- constants ---------- */
const ROUTES = [
  { id:"overview",  label:"Обзор",      icon:"i-overview",  title:"Обзор" },
  { id:"providers", label:"Провайдеры", icon:"i-providers", title:"Провайдеры" },
  { id:"models",    label:"Каталог",    icon:"i-models",    title:"Каталог моделей" },
  { id:"quota",     label:"Квоты",      icon:"i-quota",     title:"Квоты AntiGravity" },
  { id:"settings",  label:"Параметры",  icon:"i-settings",  title:"Параметры" },
];
const POLL_MS = 10000;
// Address age is rendered as a relative label; five-minute buckets keep the poll
// from rebuilding the page for a counter that only moves in minutes.
const AGE_BUCKET_MS = 300000;
const AXIS_HINT = {
  mode:"Режим шлюза: local слушает только loopback, server требует токен",
  credential:"anonymous — ключ не отправляется; account — ключ уходит провайдеру",
  key_rotation:"Ротация ключей работает только под credential=account",
  family:"Семейство адресов, по которому провайдер считает лимит",
  transport:"Транспорт исходящих запросов",
};

/* ---------- state ---------- */
const state = {
  token: "",
  theme: "auto",
  route: "overview",
  status: null,
  stats: null,
  options: null,
  models: null,
  keys: null,
  quota: null,
  loading: {},
  errors: {},
  oauth: null,
  busy: new Set(),
  lastSig: "",
};

const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));

function esc(v) {
  return String(v == null ? "" : v).replace(/[&<>"']/g, (c) => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
}
// Formatters are stateless and expensive to construct; one instance lives for
// the whole page instead of one per rendered number.
const NUM_FMT = new Intl.NumberFormat("ru-RU");
const num = (v) => NUM_FMT.format(Number(v || 0));
const pct = (v) => (Number.isFinite(v) ? Math.round(v * 1000) / 10 : 0).toLocaleString("ru-RU") + "%";
const CLOCK_FMT = new Intl.DateTimeFormat("ru-RU", { hour:"2-digit", minute:"2-digit", second:"2-digit" });
const clock = (ts) => (ts ? CLOCK_FMT.format(new Date(ts)) : "");

function fmtUptime(sec) {
  const s = Math.max(0, Math.floor(Number(sec) || 0));
  const d = Math.floor(s / 86400), h = Math.floor((s % 86400) / 3600), m = Math.floor((s % 3600) / 60);
  if (d > 0) return `${d} д ${h} ч`;
  if (h > 0) return `${h} ч ${m} мин`;
  if (m > 0) return `${m} мин`;
  return `${s} с`;
}
function relTime(ms) {
  if (!ms) return "—";
  const diff = Date.now() - Number(ms);
  if (diff < 0) return "только что";
  const m = Math.floor(diff / 60000);
  if (m < 1) return "только что";
  if (m < 60) return `${m} ${m === 1 ? "минуту" : m < 5 ? "минуты" : "минут"} назад`;
  const h = Math.floor(m / 60);
  if (h < 24) return `${h} ч назад`;
  return `${Math.floor(h / 24)} д назад`;
}
function isoIn(iso) {
  if (!iso) return "";
  const t = Date.parse(iso);
  if (!Number.isFinite(t)) return esc(iso);
  const mins = Math.round((t - Date.now()) / 60000);
  if (mins <= 0) return "скоро сбросится";
  if (mins >= 2880) return `через ${Math.round(mins / 1440)} д`;
  const h = Math.floor(mins / 60), m = mins % 60;
  if (h >= 1) return m ? `через ${h} ч ${m} мин` : `через ${h} ч`;
  return `через ${m} мин`;
}
// Dialer errors are whole sentences with URLs in them. A card that shows two of
// them becomes a wall of text, so the row carries the reason and the raw string
// stays in the title.
const ERR_REASONS = [
  [/no route to host/i, "нет маршрута"],
  [/network is unreachable/i, "сеть недоступна"],
  [/connection refused/i, "соединение отклонено"],
  [/timeout|deadline exceeded/i, "таймаут"],
  [/no such host/i, "DNS не отвечает"],
];
function shortErr(msg) {
  const text = String(msg || "");
  const hit = ERR_REASONS.find(([re]) => re.test(text));
  if (hit) return hit[1];
  return text.length > 72 ? text.slice(0, 69) + "…" : text;
}
function dayLabel(day) {  const d = new Date(day + "T00:00:00");
  if (Number.isNaN(d.getTime())) return day;
  return d.toLocaleDateString("ru-RU", { day:"2-digit", month:"2-digit" });
}
function fmtDur(v) {
  if (!v) return "—";
  const m = /^(?:(\d+)h)?(?:(\d+)m)?(?:(\d+(?:\.\d+)?)s)?$/.exec(String(v).trim());
  if (!m) return String(v);
  const h = Number(m[1] || 0), mi = Number(m[2] || 0), s = Math.round(Number(m[3] || 0));
  const parts = [];
  if (h) parts.push(h + " ч");
  if (mi) parts.push(mi + " мин");
  if (s && !h) parts.push(s + " с");
  return parts.join(" ") || "0 с";
}
function safeUrl(u) {
  try {
    const p = new URL(u);
    return p.protocol === "https:" || p.protocol === "http:" ? p.href : "";
  } catch { return ""; }
}
function icon(id, cls = "nav-icon") {
  return `<svg class="${cls}" aria-hidden="true"><use href="#${id}"/></svg>`;
}

/* ---------- snackbar ---------- */
let snackTimer = null;
function toast(message, kind = "ok") {
  const el = $("#snackbar");
  el.className = "snackbar show" + (kind === "err" ? " err" : "");
  el.innerHTML = (kind === "err" ? icon("i-warn") : icon("i-check")) + `<span>${esc(message)}</span>`;
  clearTimeout(snackTimer);
  snackTimer = setTimeout(() => { el.className = "snackbar"; }, kind === "err" ? 6500 : 3500);
}

/* ---------- transport ---------- */
async function api(path, opts = {}) {
  const headers = { Accept: "application/json" };
  if (opts.body !== undefined) headers["Content-Type"] = "application/json";
  if (state.token) headers.Authorization = "Bearer " + state.token;
  let res;
  try {
    res = await fetch(path, { method: opts.method || "GET", headers, body: opts.body === undefined ? undefined : JSON.stringify(opts.body) });
  } catch (err) {
    throw new Error("демон не отвечает: " + err.message);
  }
  const text = await res.text();
  let data = null;
  try { data = text ? JSON.parse(text) : null; } catch { data = { error: text }; }
  if (!res.ok) {
    if (res.status === 401) openTokenDialog(true);
    const msg = (data && data.error) || `HTTP ${res.status}`;
    throw new Error(msg);
  }
  return data;
}

/* ---------- data loading ---------- */
async function loadStatus() {
  try {
    state.status = await api("/_control/status");
    state.errors.status = null;
  } catch (err) {
    state.errors.status = err.message;
    throw err;
  }
}
async function loadStats() {
  try { state.stats = await api("/_control/stats"); } catch { /* optional */ }
}
async function loadOptions() {
  state.options = await api("/_control/options");
}
async function loadModels(force) {
  if (state.models && !force) return;
  state.models = await api("/_control/models");
}
async function loadKeys() {
  state.keys = await api("/_control/keys");
}
async function loadQuota() {
  state.quota = await api("/_control/antigravity/quota");
}

async function refreshCurrent(force) {
  const r = state.route;
  try {
    if (r === "overview") { await loadStatus(); await loadStats(); }
    else if (r === "providers") { await Promise.all([loadStatus(), loadOptions(), loadKeys()]); }
    else if (r === "models") { await loadModels(force); await loadStatus().catch(() => {}); }
    else if (r === "quota") { await loadQuota(); }
    else if (r === "settings") { await loadOptions(); await loadStatus().catch(() => {}); }
    state.loadedAt = Date.now();
    // A manual refresh repaints even when every byte of data is identical: the
    // press has to answer, otherwise the button looks broken. The timer poll
    // keeps the cheap path and skips the rebuild.
    render(force);
  } catch (err) {
    state.errors.status = err.message;
    renderError(err);
  }
}

// Manual refresh: the request is usually instant, so the busy state is held for
// one frame at least — otherwise the spinner never appears and the press reads
// as ignored again.
async function manualRefresh(btn) {
  if (state.refreshing) return;
  state.refreshing = true;
  if (btn) { btn.classList.add("is-loading"); btn.setAttribute("aria-busy", "true"); btn.disabled = true; }
  const started = Date.now();
  try {
    await refreshCurrent(true);
    await new Promise((r) => setTimeout(r, Math.max(0, 400 - (Date.now() - started))));
    toast(state.errors.status ? "Обновить не удалось" : "Данные обновлены", state.errors.status ? "err" : "ok");
  } finally {
    state.refreshing = false;
    if (btn) { btn.classList.remove("is-loading"); btn.removeAttribute("aria-busy"); btn.disabled = false; }
  }
}

function renderError(err) {
  const html = `
    <section class="page-head"><div><h1>Нет связи с демоном</h1>
      <p class="lead">Запрос к <code class="mono">/_control</code> не удался. Проверьте, что служба запущена: <code class="mono">systemctl --user status providermux</code>.</p></div></section>
    <div class="card outlined"><div class="notice danger">${icon("i-warn")}<div><b>${esc(err.message)}</b><div class="small mt3 muted">После исправления нажмите «Обновить».</div></div></div></div>`;
  $("#main").innerHTML = html;
  state.lastSig = "";
}

/* ---------- rendering ---------- */
// The signature is what the views actually read. Uptime and address age move on
// every poll, so they enter it only at the resolution the markup shows;
// everything else is compared verbatim. Without this the ten-second poll tears
// down and rebuilds the whole document even when no counter has changed.
function renderSignature() {
  const st = state.status;
  const addresses = st ? (st.addresses || []).map((a) => [
    a.family, a.address || "", a.error || "", Math.floor((a.age_ms || 0) / AGE_BUCKET_MS),
  ]) : null;
  const status = st ? {
    listen: st.listen, mode: st.mode,
    totals: st.totals_today || null, providers: st.providers || [], addresses,
  } : null;
  // updated_at is the save clock, not a counter: the daemon bumps it on every
  // flush, and nothing in the panel renders it.
  const stats = state.stats ? { today: state.stats.today, days: state.stats.days } : null;
  return JSON.stringify([
    state.route, state.theme, state.token, state.modelQuery || "", state.modelProvider || "",
    Array.from(state.busy).sort(),
    status, stats, state.options, state.models, state.keys, state.quota, state.oauth,
  ]);
}

function render(force) {
  const active = document.activeElement;
  const typing = active && ["INPUT", "SELECT", "TEXTAREA"].includes(active.tagName) && active.closest("#main");
  if (typing && !force) return;

  const sig = renderSignature();
  if (!force && sig === state.lastSig) {
    updateHealth();
    return;
  }
  state.lastSig = sig;

  const scroll = window.scrollY;
  const views = { overview: viewOverview, providers: viewProviders, models: viewModels, quota: viewQuota, settings: viewSettings };
  $("#main").innerHTML = (views[state.route] || viewOverview)();
  wireView();
  window.scrollTo(0, scroll);
  updateHealth();
  updateTokenLabel();
}

function updateHealth() {
  const pill = $("#health-pill"), txt = $("#health-text");
  if (state.errors.status && !state.status) {
    pill.className = "pill err"; txt.textContent = "нет связи";
  } else if (state.status) {
    pill.className = "pill ok";
    txt.textContent = "работает · " + fmtUptime(state.status.uptime_seconds);
  } else {
    pill.className = "pill"; txt.textContent = "проверка…";
  }
  $("#brand-sub").textContent = state.status ? state.status.listen : "панель шлюза";
  const stamp = $("#last-updated");
  if (stamp) stamp.textContent = state.loadedAt ? "обновлено " + clock(state.loadedAt) : "";
  updateRailMeta();
}

// The drawer footer carries the same facts as the app bar, in the place where a
// nav column otherwise ends in emptiness.
function updateRailMeta() {
  const box = $("#rail-meta");
  if (!box) return;
  const st = state.status;
  box.innerHTML = st
    ? `<div><b>${esc(st.listen)}</b></div><div>режим ${esc(st.mode)}</div><div>аптайм ${esc(fmtUptime(st.uptime_seconds))}</div>`
    : `<div>нет данных</div>`;
}
function updateTokenLabel() {
  $("#token-label").textContent = state.token ? "Токен задан" : "Токен";
}

function pageHead(title, lead, actions = "") {
  return `<section class="page-head"><div><h1>${esc(title)}</h1>${lead ? `<p class="lead">${lead}</p>` : ""}</div><div class="spacer"></div>${actions}</section>`;
}

/* ----- overview ----- */
function viewOverview() {
  if (!state.status) return pageHead("Обзор", "Загрузка состояния…") + `<div class="card"><div class="skeleton" style="width:50%;height:20px"></div></div>`;
  const st = state.status;
  const t = st.totals_today || { ok:0, refused:0, aborted:0, by_model:[], by_address:[] };
  const total = (t.ok || 0) + (t.refused || 0) + (t.aborted || 0);
  const rate = total ? t.ok / total : 0;
  const providers = st.providers || [];

  const days = (state.stats && state.stats.days ? state.stats.days.slice(0, 7).slice().reverse() : []);
  const maxOk = Math.max(1, ...days.map((d) => d.ok || 0));
  const chart = days.length ? `
    <div class="chart">
      ${days.map((d) => {
        const h = Math.max(4, Math.round(((d.ok || 0) / maxOk) * 64));
        return `<div class="chart-col">
          <div class="chart-count">${num(d.ok)}</div>
          <div class="chart-bar" style="height:${h}px" title="${esc(d.day)}: ${num(d.ok)} ok"></div>
          <div class="chart-day">${esc(dayLabel(d.day))}</div>
        </div>`;
      }).join("")}
    </div>` : `<div class="empty">${icon("i-info")}<div>История появится после первых запросов</div></div>`;

  // Counters live on the same row as the address they belong to: a separate
  // table of one or two rows is the kind of card that makes a dashboard look
  // unfinished, and it repeats the family column the row already carries.
  const counters = (a) => {
    const c = (t.by_address || []).find((x) => (x.family || "") === a.family);
    if (!c) return "";
    return `<div class="small muted">${num(c.ok)} ok · ${num(c.refused)} отказ · ${num(c.aborted)} обрыв</div>`;
  };
  const addr = (st.addresses || []).map((a) => a.error
    ? `<div class="kv"><dt><span class="pill warn">${esc(a.family)}</span></dt><dd><span class="small muted" title="${esc(a.error)}">${esc(shortErr(a.error))}</span></dd></div>`
    : `<div class="kv"><dt><span class="pill accent">${esc(a.family)}</span></dt><dd><span class="mono">${esc(a.address)}</span>${counters(a)}<div class="small muted">${relTime(Date.now() - (a.age_ms || 0))}</div></dd></div>`
  ).join("") || `<div class="empty">${icon("i-warn")}<div>Адрес выхода ещё не определён</div></div>`;

  const provRows = providers.map((p) => `
    <div class="kv">
      <dt><b>${esc(p.id)}</b><div class="small muted">${esc(p.credential)}${p.key_used ? " · ключ используется" : ""}</div></dt>
      <dd><span class="badge">${num(p.free_models)}/${num(p.models)}</span><div class="small muted">ключей: ${num(p.keys)}</div></dd>
    </div>`).join("") || `<div class="empty">${icon("i-info")}<div>Провайдеры не объявлены</div></div>`;

  const byModel = (t.by_model || []).map((m) => `
    <tr><td><span class="mono">${esc(m.model)}</span></td>
      <td class="num">${num(m.ok)}</td><td class="num">${num(m.refused)}</td><td class="num hide-sm">${num(m.aborted)}</td>
      <td class="num hide-sm muted small">${relTime(m.last_seen)}</td></tr>`).join("");

  return `
  ${pageHead("Обзор", `Сегодня ${esc(t.day || "—")} · режим <b>${esc(st.mode)}</b>`,
    `<button class="btn btn-tonal" data-act="refresh">${icon("i-refresh")}<span>Обновить</span></button>`)}

  <div class="grid kpi-grid">
    <div class="card"><div class="kpi"><span class="kpi-label">Успешно</span><span class="kpi-value">${num(t.ok)}</span><span class="kpi-note">ответов отдано клиентам</span></div></div>
    <div class="card"><div class="kpi"><span class="kpi-label">Отказы</span><span class="kpi-value err">${num(t.refused)}</span><span class="kpi-note">переданы дословно</span></div></div>
    <div class="card"><div class="kpi"><span class="kpi-label">Оборвано</span><span class="kpi-value">${num(t.aborted)}</span><span class="kpi-note">клиент закрыл поток</span></div></div>
    <div class="card"><div class="kpi"><span class="kpi-label">Доля успеха</span><span class="kpi-value">${pct(rate)}</span>
      <div class="bar-track mt3"><div class="bar-fill ok" style="width:${Math.round(rate*100)}%"></div></div></div></div>
  </div>

  <div class="grid split mt4">
    <section class="card"><div class="card-head"><h2 class="card-title">Динамика за неделю</h2></div>${chart}</section>
    <section class="card"><div class="card-head"><h2 class="card-title">Адреса выхода</h2><span class="pill">${esc(st.mode)}</span></div>${addr}
      <p class="hint mt3">Лимиты бесплатных моделей считаются по адресу, поэтому семейство адресов — ось конфигурации.</p></section>
  </div>

  <div class="grid split mt4">
    <section class="card"><div class="card-head"><h2 class="card-title">Модели сегодня</h2></div>
      ${byModel ? `<div class="table-wrap"><table><thead><tr><th>Модель</th><th class="num">OK</th><th class="num">Отказ</th><th class="num hide-sm">Обрыв</th><th class="num hide-sm">Активность</th></tr></thead><tbody>${byModel}</tbody></table></div>` : `<div class="empty">${icon("i-info")}<div>Сегодня запросов ещё не было</div></div>`}
    </section>
    <section class="card"><div class="card-head"><h2 class="card-title">Провайдеры</h2><a class="btn btn-text btn-sm" href="#providers">Настроить</a></div>${provRows}</section>
  </div>`;
}

/* ----- providers ----- */
function providerData(id) {
  const st = (state.status && state.status.providers || []).find((p) => p.id === id) || {};
  const cur = (state.options && state.options.current && state.options.current.providers && state.options.current.providers[id]) || {};
  const keys = (state.keys && state.keys.providers || []).find((p) => p.provider === id) || {};
  return { st, cur, fingerprints: keys.keys || [] };
}

function ask(text, okLabel = "Удалить") {
  const dialog = $("#confirm-dialog");
  $("#confirm-text").textContent = text;
  $("#confirm-ok").textContent = okLabel;
  dialog.returnValue = "";
  dialog.showModal();
  return new Promise((resolve) => {
    dialog.addEventListener("close", () => resolve(dialog.returnValue === "ok"), { once: true });
  });
}

function segmented(name, values, current, attrs) {
  return `<div class="segmented" role="radiogroup" aria-label="${esc(name)}">${values.map((v) =>
    `<button type="button" role="radio" aria-checked="${v === current}" ${attrs} data-value="${esc(v)}">${esc(v)}</button>`).join("")}</div>`;
}

function providerCard(id) {
  const { st, cur, fingerprints } = providerData(id);
  const credential = cur.credential || st.credential || "anonymous";
  const rotation = cur.key_rotation ? cur.key_rotation : (st.key_rotation ? "on" : "off");
  const transport = cur.transport || "direct";
  const accountDisabled = credential !== "account" || fingerprints.length === 0;
  const transports = (state.options && state.options.transports) || ["direct"];
  const accounts = fingerprints.map((fp, i) => ({ fp, n: i + 1 }));
  const currentAccount = cur.account || "";
  const busy = (k) => (state.busy.has(k) ? "disabled aria-busy=\"true\"" : "");

  return `
  <section class="card outlined">
    <div class="card-head">
      <h2 class="card-title">${esc(id)}</h2>
      <span class="pill ${st.key_used ? "accent" : ""}">${st.key_used ? "ключ в деле" : "без ключа"}</span>
      <div class="appbar-spacer"></div>
      <span class="badge">${num(st.free_models)}/${num(st.models)}</span>
    </div>

    <dl style="margin:0 0 16px">
      <div class="kv"><dt>Моделей бесплатных</dt><dd>${num(st.free_models)} из ${num(st.models)}</dd></div>
      <div class="kv"><dt>Ключей в пуле</dt><dd>${num(st.keys)}</dd></div>
      <div class="kv"><dt>Ротация активна</dt><dd>${st.key_rotation ? "да" : "нет"}</dd></div>
    </dl>

    <div class="field"><span class="label" id="lbl-cred-${esc(id)}">Credential</span>
      ${segmented("Credential " + id, ["account", "anonymous"], credential, `data-act="set-axis" data-provider="${esc(id)}" data-axis="credential" ${busy("credential-" + id)}`)}
      <span class="hint">${esc(AXIS_HINT.credential)}</span>
    </div>

    <div class="row mt4" style="justify-content:space-between">
      <div><div class="card-sub">Ротация ключей</div><div class="hint">${esc(AXIS_HINT.key_rotation)}</div></div>
      <button class="switch" type="button" role="switch" aria-checked="${rotation === "on"}"
        aria-label="Ротация ключей ${esc(id)}" data-act="toggle-rotation" data-provider="${esc(id)}"
        ${credential !== "account" ? "disabled" : ""} ${busy("key_rotation-" + id)}></button>
    </div>

    <div class="field mt4"><label class="label" for="tr-${esc(id)}">Транспорт</label>
      <select class="select" id="tr-${esc(id)}" data-act="set-axis" data-provider="${esc(id)}" data-axis="transport" ${busy("transport-" + id)}>
        ${transports.map((t) => `<option value="${esc(t)}" ${t === transport ? "selected" : ""}>${esc(t)}</option>`).join("")}
      </select>
    </div>

    <div class="field mt4"><label class="label" for="acc-${esc(id)}">Аккаунт (пин)</label>
      <select class="select" id="acc-${esc(id)}" data-act="set-account" data-provider="${esc(id)}" ${accountDisabled ? "disabled" : ""} ${busy("account-" + id)}>
        <option value="">авто — любой из пула</option>
        ${accounts.map((a) => `<option value="${esc(a.fp)}" ${a.fp === currentAccount ? "selected" : ""}>${a.n}. ${esc(a.fp)}</option>`).join("")}
      </select>
      <span class="hint">${accountDisabled ? "Нужен credential=account и хотя бы один ключ" : "К какому ключу привязывать запросы"}</span>
    </div>

    <div class="mt4">
      <div class="card-sub">Ключи</div>
      <div class="row mt3" id="keys-${esc(id)}">
        ${fingerprints.length ? fingerprints.map((fp) => `<span class="chip"><span class="mono">${esc(fp)}</span>
          <button type="button" data-act="remove-key" data-provider="${esc(id)}" data-key="${esc(fp)}" aria-label="Удалить ключ ${esc(fp)}">${icon("i-close","nav-icon")}</button></span>`).join("")
        : `<span class="small muted">пул пуст</span>`}
      </div>
      <form class="row mt3" id="keyform-${esc(id)}" data-provider="${esc(id)}">
        <input class="input" style="flex:1;min-width:180px" type="password" autocomplete="off" spellcheck="false"
          name="key" placeholder="вставить ключ провайдера" aria-label="Новый ключ для ${esc(id)}" required>
        <button class="btn btn-tonal" type="submit">${icon("i-plus")}<span>Добавить</span></button>
      </form>
      <p class="hint mt3">Ключи из панели живут в памяти демона и исчезают при рестарте. Долговечное место — <span class="mono">~/.config/providermux/keys.env</span>.</p>
    </div>

    ${id === "antigravity" ? `<a class="btn btn-text btn-sm mt3" href="#quota">${icon("i-link")}<span>Квоты и OAuth</span></a>` : ""}
  </section>`;
}

function viewProviders() {
  if (!state.options) return pageHead("Провайдеры", "Загрузка…") + `<div class="card"><div class="skeleton" style="width:40%;height:20px"></div></div>`;
  const ids = (state.options.providers || []).slice();
  return `
  ${pageHead("Провайдеры", "Каждая ось применяется на лету и сохраняется в <span class='mono'>config.json</span>. Живой демон держит настройку до рестарта — она уже записана в файл.", `<button class="btn btn-tonal" data-act="refresh">${icon("i-refresh")}<span>Обновить</span></button>`)}
  <div class="grid two">${ids.map(providerCard).join("") || `<div class="card"><div class="empty">${icon("i-info")}<div>Провайдеры не объявлены</div></div></div>`}</div>`;
}

/* ----- models ----- */
function viewModels() {
  if (!state.models) return pageHead("Каталог моделей", "Загрузка…") + `<div class="card"><div class="skeleton" style="width:40%;height:20px"></div></div>`;
  const all = state.models.models || [];
  const q = (state.modelQuery || "").toLowerCase();
  const prov = state.modelProvider || "";
  const rows = all.filter((m) => (!prov || m.provider === prov) && (!q ||
    (m.id + " " + (m.name || "") + " " + m.provider).toLowerCase().includes(q)));
  const provs = Array.from(new Set(all.map((m) => m.provider)));

  const caps = (m) => [
    m.vision ? "vision" : "", m.reasoning ? "reasoning" : "", m.free ? "free" : ""
  ].filter(Boolean).map((c) => `<span class="pill ${c === "free" ? "ok" : ""}">${c}</span>`).join(" ");

  const body = rows.map((m) => `
    <tr>
      <td><div style="font-weight:500">${esc(m.name || m.id)}</div><div class="mono muted">${esc(m.id)}</div></td>
      <td class="hide-sm"><span class="pill">${esc(m.provider)}</span></td>
      <td class="num">${m.context ? num(m.context) : "—"}</td>
      <td class="num hide-sm">${m.max_output ? num(m.max_output) : "—"}</td>
      <td class="hide-sm">${caps(m)}</td>
      <td class="num"><button class="btn btn-icon btn-sm" data-act="copy" data-copy="${esc(m.provider + "/" + m.id)}" aria-label="Скопировать идентификатор ${esc(m.id)}" title="Скопировать ${esc(m.provider)}/${esc(m.id)}">${icon("i-copy")}</button></td>
    </tr>`).join("");

  return `
  ${pageHead("Каталог моделей", `Объявлено ${num(all.length)} моделей у ${num(provs.length)} провайдеров. Необъявленная возможность не выдумывается — модель просто не попадает в список.`,
    `<button class="btn btn-tonal" data-act="refresh-force">${icon("i-refresh")}<span>Перечитать</span></button>`)}
  <section class="card">
    <div class="row" style="margin-bottom:16px">
      <div class="field" style="flex:1;min-width:220px">
        <label class="label" for="model-search">Поиск</label>
        <input class="input" id="model-search" type="search" placeholder="имя, идентификатор, провайдер" value="${esc(state.modelQuery || "")}" autocomplete="off">
      </div>
      <div class="segmented" role="group" aria-label="Фильтр по провайдеру" style="align-self:flex-end">
        <button type="button" data-act="filter-provider" data-value="" aria-pressed="${!prov}">все</button>
        ${provs.map((p) => `<button type="button" data-act="filter-provider" data-value="${esc(p)}" aria-pressed="${prov === p}">${esc(p)}</button>`).join("")}
      </div>
    </div>
    ${rows.length ? `<div class="table-wrap"><table><thead><tr><th>Модель</th><th class="hide-sm">Провайдер</th><th class="num">Контекст</th><th class="num hide-sm">Выход</th><th class="hide-sm">Возможности</th><th class="num"><span class="sr-only">Действия</span></th></tr></thead><tbody>${body}</tbody></table></div>`
      : `<div class="empty">${icon("i-info")}<div>Ничего не найдено<button class="btn btn-text btn-sm" data-act="reset-filter">Сбросить фильтр</button></div></div>`}
  </section>`;
}

/* ----- quota ----- */
function viewQuota() {
  const q = state.quota;
  const oauthCard = `
    <section class="card outlined">
      <div class="card-head"><h2 class="card-title">Подключить аккаунт Google</h2></div>
      <p class="hint">Кодовая страница открывается один раз. После согласия браузер вернёт на адрес с <span class="mono">code=…</span> — вставьте его ниже.</p>
      <div class="row mt4">
        <button class="btn btn-filled" data-act="oauth-start" ${state.oauth && state.oauth.started ? "disabled" : ""}>${icon("i-link")}<span>Начать вход</span></button>
        ${state.oauth && safeUrl(state.oauth.auth_url) ? `<a class="btn btn-outlined" href="${esc(safeUrl(state.oauth.auth_url))}" target="_blank" rel="noopener">${icon("i-external")}<span>Открыть страницу</span></a>` : ""}
      </div>
      <form class="stack mt4" id="oauth-form">
        <div class="field"><label class="label" for="oauth-code">Код или адрес возврата</label>
          <textarea class="textarea" id="oauth-code" placeholder="http://localhost:51121/oauth-callback?code=…&amp;state=…" required></textarea></div>
        <div class="field"><label class="label" for="oauth-project">Project ID (необязательно)</label>
          <input class="input" id="oauth-project" placeholder="aicode-consumers" autocomplete="off"></div>
        <div class="row"><button class="btn btn-tonal" type="submit">${icon("i-check")}<span>Обменять код на ключ</span></button>
          ${state.oauth && state.oauth.verifier ? `<span class="pill">verifier ${esc(state.oauth.verifier.slice(0, 8))}…</span>` : ""}</div>
      </form>
      <p class="hint mt3">Полученный ключ тоже живёт только до рестарта; для постоянного — положите его в <span class="mono">keys.env</span>.</p>
    </section>`;

  if (!q) {
    return `${pageHead("Квоты AntiGravity", "Расход лимитов по аккаунтам и окнам.")}${oauthCard}`;
  }
  const accounts = q.accounts || [];
  const accountCards = accounts.map((a) => `
    <section class="card">
      <div class="card-head"><h2 class="card-title">${esc(a.email || a.account_id)}</h2>
        <span class="pill ${q.key_used ? "accent" : ""}">${q.key_used ? "используется" : "в резерве"}</span></div>
      <div class="mono muted small" style="margin-bottom:12px">${esc(a.account_id)}</div>
      ${(a.groups || []).map((g) => `
        <div class="mt4"><div class="card-sub">${esc(g.group)}</div>
          <div class="hint">${esc(g.description || "")} · моделей: ${num(g.model_count)}</div>
          ${(g.windows || []).map((w) => {
            const f = Math.max(0, Math.min(1, Number(w.remaining_fraction) || 0));
            const tone = f <= 0.1 ? "err" : f <= 0.35 ? "warn" : "ok";
            return `<div class="mt3">
              <div class="row" style="justify-content:space-between"><span class="small">${esc(w.display_name || w.window)}</span><span class="small muted">${pct(f)} · ${isoIn(w.reset_time)}</span></div>
              <div class="bar-track mt3" role="img" aria-label="${esc(w.display_name || w.window)}: осталось ${pct(f)}"><div class="bar-fill ${tone}" style="width:${Math.round(f*100)}%"></div></div>
            </div>`;
          }).join("")}
        </div>`).join("")}
    </section>`).join("");

  return `
  ${pageHead("Квоты AntiGravity", `Credential: <b>${esc(q.credential)}</b> · ротация: <b>${q.rotation ? "вкл" : "выкл"}</b> · ключ: <b>${q.key_used ? "используется" : "нет"}</b>`,
    `<button class="btn btn-tonal" data-act="refresh">${icon("i-refresh")}<span>Обновить</span></button>`)}
  ${q.configured === false ? `<div class="notice mt4">${icon("i-info")}<div>AntiGravity не объявлен в конфигурации — квот нет, но аккаунт можно подключить.</div></div>` : ""}
  <div class="grid two mt4">${accountCards || `<div class="card"><div class="empty">${icon("i-gauge")}<div>Аккаунтов с квотами нет</div></div></div>`}</div>
  <div class="mt4">${oauthCard}</div>`;
}

/* ----- settings ----- */
function axisRow(axis, label, values, current, hint) {
  return `
    <div class="card outlined">
      <div class="row" style="justify-content:space-between">
        <div style="min-width:180px"><div class="card-title">${esc(label)}</div><div class="hint">${esc(hint || AXIS_HINT[axis] || "")}</div></div>
        ${segmented(label, values, current, `data-act="set-global" data-axis="${esc(axis)}" ${state.busy.has("g-" + axis) ? "disabled" : ""}`)}
      </div>
    </div>`;
}

function viewSettings() {
  const c = (state.options && state.options.current) || {};
  const opts = state.options || {};
  const timeouts = [["first_event_timeout", "Первый фрейм"], ["idle_timeout", "Простой"], ["reasoning_idle_timeout", "Простой рассуждения"]];
  return `
  ${pageHead("Параметры", "Глобальные оси шлюза. Панель меняет только то, что демон умеет менять на лету; таймауты и адрес слушателя живут во флагах, окружении и <span class='mono'>config.json</span>.")}
  <div class="stack">
    ${axisRow("mode", "Режим", opts.modes || ["local", "server"], c.mode, AXIS_HINT.mode)}
    ${axisRow("credential", "Credential", ["anonymous", "account"], c.credential, AXIS_HINT.credential)}
    ${axisRow("key_rotation", "Ротация ключей", opts.toggle || ["on", "off"], c.key_rotation, AXIS_HINT.key_rotation)}
    ${axisRow("family", "Семейство адресов", ["auto", "v4", "v6"], c.family, AXIS_HINT.family)}
    ${axisRow("transport", "Транспорт", opts.transports || ["direct"], c.transport, AXIS_HINT.transport)}

    <section class="card">
      <div class="card-head"><h2 class="card-title">Таймауты</h2><span class="pill">только чтение</span></div>
      <dl style="margin:0">${timeouts.map(([k, label]) => `<div class="kv"><dt>${esc(label)}</dt><dd class="mono">${esc(fmtDur(c[k]))}</dd></div>`).join("")}</dl>
      <p class="hint mt3">Меняются флагами <span class="mono">--first-event-timeout</span>, <span class="mono">--idle-timeout</span>, <span class="mono">--reasoning-idle-timeout</span> и требуют рестарта.</p>
    </section>

    <section class="card">
      <div class="card-head"><h2 class="card-title">Доступ</h2></div>
      <div class="row" style="justify-content:space-between">
        <div><div class="card-sub">Токен панели</div><div class="hint">${state.token ? "задан в этом браузере" : "не задан — подходит для local"}</div></div>
        <button class="btn btn-tonal" data-act="token-open">${icon("i-lock")}<span>Изменить</span></button>
      </div>
      <div class="row mt4" style="justify-content:space-between">
        <div><div class="card-sub">Тема</div><div class="hint">Сейчас: ${state.theme === "auto" ? "как в системе" : state.theme === "dark" ? "тёмная" : "светлая"}</div></div>
        <button class="btn btn-tonal" data-act="theme">${icon(state.theme === "dark" ? "i-sun" : "i-moon")}<span>Переключить</span></button>
      </div>
    </section>
  </div>`;
}

/* ---------- view wiring ---------- */
function wireView() {
  const main = $("#main");
  const search = $("#model-search", main);
  if (search) {
    search.addEventListener("input", (e) => {
      state.modelQuery = e.target.value;
      const at = e.target.selectionStart;
      render(true);
      const again = $("#model-search");
      if (again) { again.focus(); again.setSelectionRange(at, at); }
    });
  }
  $$(".segmented[role='radiogroup']", main).forEach((group) => {
    const radios = $$("button[role='radio']", group);
    const current = radios.findIndex((b) => b.getAttribute("aria-checked") === "true");
    radios.forEach((b, i) => { b.tabIndex = i === Math.max(0, current) ? 0 : -1; });
    group.addEventListener("keydown", (e) => {
      const step = e.key === "ArrowRight" || e.key === "ArrowDown" ? 1 : e.key === "ArrowLeft" || e.key === "ArrowUp" ? -1 : 0;
      if (!step) return;
      e.preventDefault();
      const at = radios.indexOf(document.activeElement);
      const next = radios[(at + step + radios.length) % radios.length];
      radios.forEach((b) => { b.tabIndex = b === next ? 0 : -1; });
      next.focus();
      next.click();
    });
  });
  $$("select[data-act]", main).forEach((sel) => {
    sel.addEventListener("change", () => {
      if (sel.dataset.act === "set-account") setAxis(sel.dataset.provider, "account", sel.value, "account-" + sel.dataset.provider);
      else setAxis(sel.dataset.provider, sel.dataset.axis, sel.value, sel.dataset.axis + "-" + sel.dataset.provider);
    });
  });
  $$("form[id^='keyform-']", main).forEach((form) => {
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const provider = form.dataset.provider;
      const input = form.querySelector("input[name='key']");
      const key = input.value.trim();
      if (!key) return;
      input.value = "";
      try {
        await api("/_control/keys/add", { method:"POST", body:{ provider, key } });
        toast(`Ключ добавлен: ${provider}`);
        await loadKeys(); await loadStatus();
        render();
      } catch (err) { toast(err.message, "err"); }
    });
  });
  const oauth = $("#oauth-form", main);  if (oauth) {
    oauth.addEventListener("submit", async (e) => {
      e.preventDefault();
      const raw = $("#oauth-code").value.trim();
      const project = $("#oauth-project").value.trim();
      if (!raw) return;
      let code = raw, redirect = "";
      if (/^https?:\/\//i.test(raw)) {
        try {
          const u = new URL(raw);
          code = u.searchParams.get("code") || "";
          redirect = u.origin + u.pathname;
        } catch { /* keep raw */ }
      }
      if (!code) { toast("В адресе нет параметра code", "err"); return; }
      const body = { code, verifier: state.oauth ? state.oauth.verifier : "" };
      if (redirect) body.redirect_uri = redirect;
      if (project) body.project_id = project;
      try {
        await api("/_control/antigravity/oauth/exchange", { method:"POST", body });
        toast("Ключ получен и добавлен в пул");
        state.oauth = null;
        await loadQuota(); await loadStatus().catch(() => {});
        render();
      } catch (err) { toast(err.message, "err"); }
    });
  }
}

/* ---------- actions ---------- */
async function setAxis(provider, axis, value, busyKey) {
  state.busy.add(busyKey);
  render();
  const body = provider ? { provider, axis, value } : { axis, value };
  try {
    await api("/_control/options", { method:"POST", body });
    await loadOptions();
    toast(`${provider ? provider + ": " : ""}${axis} → ${value || "авто"}`);
  } catch (err) {
    toast(err.message, "err");
  } finally {
    state.busy.delete(busyKey);
    if (state.route === "providers") await loadStatus().catch(() => {});
    render();
  }
}

document.addEventListener("click", async (e) => {
  const el = e.target.closest("[data-act]");
  if (!el) return;
  const act = el.dataset.act;

  if (act === "refresh") { await manualRefresh(el); return; }
  if (act === "refresh-force") { await manualRefresh(el); return; }
  if (act === "theme") { cycleTheme(); return; }
  if (act === "token-open") { openTokenDialog(false); return; }
  if (act === "token-save") {
    e.preventDefault();
    state.token = $("#token-input").value.trim();
    localStorage.setItem("pmux_token", state.token);
    $("#token-dialog").close();
    updateTokenLabel();
    toast(state.token ? "Токен сохранён" : "Токен очищен");
    await refreshCurrent(true);
    return;
  }
  if (act === "token-clear") {
    e.preventDefault();
    state.token = "";
    localStorage.removeItem("pmux_token");
    $("#token-input").value = "";
    $("#token-dialog").close();
    updateTokenLabel();
    toast("Токен очищен");
    return;
  }
  if (act === "set-global") {
    const value = el.dataset.value;
    if (el.getAttribute("aria-checked") === "true") return;
    await setAxis("", el.dataset.axis, value, "g-" + el.dataset.axis);
    return;
  }
  if (act === "set-axis") {
    if (el.tagName === "SELECT") return; /* the change listener owns selects */
    const { provider, axis } = el.dataset;
    const value = el.dataset.value;
    await setAxis(provider, axis, value, axis + "-" + provider);
    return;
  }
  if (act === "set-account") {
    return; /* the change listener owns selects */
  }
  if (act === "toggle-rotation") {
    const provider = el.dataset.provider;
    const next = el.getAttribute("aria-checked") === "true" ? "off" : "on";
    await setAxis(provider, "key_rotation", next, "key_rotation-" + provider);
    return;
  }
  if (act === "remove-key") {
    const { provider, key } = el.dataset;
    if (!(await ask(`Удалить ключ ${key} из пула «${provider}»? Вернуть его можно только вставкой заново.`))) return;
    try {
      await api("/_control/keys/remove", { method:"POST", body:{ provider, key } });
      toast(`Ключ ${key} удалён`);
      await loadKeys(); await loadStatus();
      render();
    } catch (err) { toast(err.message, "err"); }
    return;
  }
  if (act === "copy") {
    const text = el.dataset.copy;
    try {
      await navigator.clipboard.writeText(text);
      toast(`Скопировано: ${text}`);
    } catch { toast("Буфер обмена недоступен", "err"); }
    return;
  }
  if (act === "filter-provider") {
    state.modelProvider = el.dataset.value;
    render();
    return;
  }
  if (act === "reset-filter") {
    state.modelQuery = ""; state.modelProvider = ""; render(); return;
  }
  if (act === "oauth-start") {
    try {
      const res = await api("/_control/antigravity/oauth/start", { method:"POST", body:{ provider:"antigravity" } });
      state.oauth = { ...res, started:true };
      toast("Страница входа открыта в новой вкладке");
      const target = safeUrl(res.auth_url); if (target) window.open(target, "_blank", "noopener");
      render();
    } catch (err) { toast(err.message, "err"); }
    return;
  }
});

/* ---------- theme ---------- */
function applyTheme() {
  if (state.theme === "auto") document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme", state.theme);
  const btn = $("#btn-theme");
  if (btn) btn.innerHTML = icon(state.theme === "dark" ? "i-sun" : "i-moon");
  // Both theme-color tags are media-scoped, so the browser chrome follows the OS
  // scheme on its own; the manual override repaints the page only.
}
function cycleTheme() {
  state.theme = state.theme === "auto" ? "light" : state.theme === "light" ? "dark" : "auto";
  localStorage.setItem("pmux_theme", state.theme);
  applyTheme();
  if (state.route === "settings") render();
}

/* ---------- dialogs ---------- */
let lastFocus = null;
function openTokenDialog(unauthorized) {
  const dlg = $("#token-dialog");
  lastFocus = document.activeElement;
  $("#token-input").value = state.token;
  dlg.showModal();
  $("#token-input").focus();
  if (unauthorized) toast("Нужен токен: демон ответил 401", "err");
  dlg.addEventListener("close", () => { if (lastFocus) lastFocus.focus(); }, { once:true });
}

/* ---------- routing ---------- */
function buildNav() {
  const items = ROUTES.map((r) => `
    <a href="#${r.id}" class="rail-item" data-route="${r.id}">
      ${icon(r.icon)}<span>${r.label}</span>
    </a>`).join("");
  $("#rail").innerHTML = items + `<div class="rail-foot" id="rail-meta"></div>`;
  $("#bottom-nav").innerHTML = ROUTES.map((r) => `
    <a href="#${r.id}" class="bottom-item" data-route="${r.id}">
      ${icon(r.icon)}<span>${r.label}</span>
    </a>`).join("");
}
function routeFromHash() {
  const id = (location.hash || "").replace(/^#\/?/, "");
  return ROUTES.some((r) => r.id === id) ? id : "overview";
}
function applyRoute() {
  state.route = routeFromHash();
  const meta = ROUTES.find((r) => r.id === state.route);
  document.title = (meta ? meta.title + " · " : "") + "providermux";
  $$("[data-route]").forEach((a) => {
    if (a.dataset.route === state.route) a.setAttribute("aria-current", "page");
    else a.removeAttribute("aria-current");
  });
  // Paint the destination before its request finishes: the views fall back to a
  // skeleton, and the alternative is a screen still showing the previous route.
  // Forced, because a focused filter field must not block navigation.
  render(true);
  refreshCurrent(false);
}

/* ---------- boot ---------- */
function boot() {
  const params = new URLSearchParams(location.search);
  const urlToken = params.get("token");
  state.token = urlToken || localStorage.getItem("pmux_token") || "";
  if (urlToken) {
    localStorage.setItem("pmux_token", urlToken);
    params.delete("token");
    const qs = params.toString();
    history.replaceState(null, "", location.pathname + (qs ? "?" + qs : "") + location.hash);
  }
  state.theme = localStorage.getItem("pmux_theme") || "auto";
  applyTheme();
  buildNav();
  updateTokenLabel();
  window.addEventListener("hashchange", applyRoute);
  $("#token-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    state.token = $("#token-input").value.trim();
    if (state.token) localStorage.setItem("pmux_token", state.token);
    else localStorage.removeItem("pmux_token");
    $("#token-dialog").close();
    updateTokenLabel();
    toast(state.token ? "Токен сохранён" : "Токен очищен");
    await refreshCurrent(true);
  });
  applyRoute();
  // A hidden tab does no work at all; coming back refreshes once instead of
  // waiting out the remainder of the interval, so the first screen after a
  // return is never stale.
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible") refreshCurrent(false);
  });
  setInterval(() => {
    if (document.visibilityState !== "visible") return;
    if (!["overview", "providers"].includes(state.route)) return;
    refreshCurrent(false);
  }, POLL_MS);
}

if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot);
else boot();
</script>
