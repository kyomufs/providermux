<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <aside class="sidebar">
    <h3>providermux</h3>
    <div id="providers-pill-nav"></div>
  </aside>
  <main class="content">
    <div id="provider-views-container"></div>
  </main>
  <script>
    const appState = { activeProvider: null, providers: [], models: [], options: {} };
    async function apiRequest(path, options = {}) {
      const res = await fetch(path, options);
      if (!res.ok) throw new Error(await res.text());
      return res.json();
    }
    function renderSidebar() {
      const nav = document.getElementById('providers-pill-nav');
      nav.innerHTML = appState.providers.map(p => 
        `<button class="pill-btn ${p.id === appState.activeProvider ? 'active' : ''}" onclick="selectProvider('${p.id}')">${p.id}</button>`
      ).join('');
    }
    window.selectProvider = async function(pId) {
      appState.activeProvider = pId;
      renderSidebar();
      renderActiveProviderView();
    };
    async function renderActiveProviderView() {
      const cont = document.getElementById('provider-views-container');
      const pId = appState.activeProvider;
      if (!pId) return;
      const p = appState.providers.find(p => p.id === pId) || {};
      cont.innerHTML = `
        <div class="grid">
          <div class="card">
            <h4>Settings: ${pId}</h4>
            <p>Credential: ${p.credential || 'anonymous'}</p>
          </div>
          <div class="card">
            <h4>Metrics</h4>
            <p>Keys: ${p.keys || 0}</p>
          </div>
        </div>
      `;
    }
    async function init() {
      const status = await apiRequest('/_control/status');
      appState.providers = status.providers;
      if (appState.providers.length > 0) selectProvider(appState.providers[0].id);
    }
    init();
  </script>
</body>
</html>
